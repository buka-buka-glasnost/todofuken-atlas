 Honshu, Japan, the largest of the four main islands of Japan. Formerly known as Izu Province, Izu Peninsula is now a part of Shizuoka Prefecture. The peninsula's populated areas are located primarily on the north and east."},{"id":"22-2","pref":"22","kind":"sight","i":2,"xy":[536.6,677.4],"ja":"久能山東照宮","wiki":"Kunōzan Tōshō-gū","summary":"The Kunōzan Tōshō-gū is a Shintō shrine in Suruga-ku in the city of Shizuoka in Shizuoka Prefecture, Japan. It is the original burial place of the first shōgun of the Tokugawa shogunate, Tokugawa Ieyasu, and is thus the oldest of the Tōshō-gū shrines in the country."},{"id":"22-3","pref":"22","kind":"sight","i":3,"xy":[559.1,676.3],"ja":"修善寺","wiki":"Shuzenji, Shizuoka","summary":"Shuzenji was a town located in Tagata District, Shizuoka Prefecture, Japan, in central Izu Peninsula."},{"id":"22-4","pref":"22","kind":"sight","i":4,"xy":[520.3,672.7],"ja":"大井川鐵道","wiki":"Ōigawa Railway","summary":"Ōigawa Railway is a private railway company in Shizuoka Prefecture, Japan, founded in 1925. The company is commonly known as Daitetsu. The company was a subsidiary of the Meitetsu Group until 2015, when it was restructured and sold to Eclipse Hidaka, a food, hotel, and investment company headquartered in Hidaka, Hokkaido."},{"id":"22-5","pref":"22","kind":"sight","i":5,"xy":[493.1,691.7],"ja":"浜名湖","wiki":"Lake Hamana","summary":"Lake Hamana is a brackish lagoon in Shizuoka Prefecture, Japan. Formerly a true lake, it is now connected to the Pacific Ocean by a channel. As an internal body of water, it is considered Japan's tenth-largest lake (by area)."},{"id":"23-c","pref":"23","kind":"capital","xy":[460.4,665.9],"wiki":"Nagoya","pop":2326844,"popYear":2021,"note":"One of Japan's largest cities and its industrial heart, with the castle's golden shachihoko.","summary":"Nagoya is the capital and most populous city of Aichi Prefecture in Japan. Nagoya is located on the Pacific coast in central Honshu, and its seaport is the largest in Japan."},{"id":"23-0","pref":"23","kind":"sight","i":0,"xy":[460,665.7],"ja":"名古屋城","wiki":"Nagoya Castle","summary":"Nagoya Castle is a Japanese castle located in Nagoya, Japan."},{"id":"23-1","pref":"23","kind":"sight","i":1,"xy":[460.5,669.1],"ja":"熱田神宮","wiki":"Atsuta Shrine","summary":"Atsuta Shrine is a Shinto shrine, home to the sacred sword Kusanagi no Tsurugi, one of the three Imperial Regalia of Japan—traditionally believed to have been established during the reign of Emperor Keikō (reigned 71–130 CE). It is located in Atsuta-ku, Nagoya, Aichi Prefecture in Japan."},{"id":"23-2","pref":"23","kind":"sight","i":2,"xy":[461.9,653.6],"ja":"犬山城","wiki":"Inuyama Castle","summary":"Inuyama Castle is a hirayama-style Japanese castle located in the city of Inuyama, Aichi Prefecture, Japan. The castle overlooks the Kiso River, which serves as the border between Aichi and Gifu Prefectures."},{"id":"23-3","pref":"23","kind":"sight","i":3,"xy":[472.6,671.7],"wiki":"Toyota, Aichi","wikiBroader":true},{"id":"23-4","pref":"23","kind":"sight","i":4,"xy":[469.3,666.4],"ja":"ジブリパーク","wiki":"Ghibli Park","summary":"Ghibli Park is a theme park in Nagakute, Aichi, Japan. It opened on 1 November 2022 and features attractions based on several of the movies produced by Studio Ghibli. First announced in 2017, with construction starting in 2020, the park is located within the grounds of the Expo 2005 Aichi Commemorative Park."},{"id":"23-5","pref":"23","kind":"sight","i":5,"xy":[464.3,656.4],"ja":"博物館明治村","wiki":"Meiji-mura","summary":"Meiji-mura is an open-air architectural museum and theme park in Inuyama, near Nagoya in Aichi prefecture, Japan. It was opened on March 18, 1965. The museum preserves historic buildings from Japan's Meiji (1867–1912), Taishō (1912–1926), and early Shōwa (1926–1945) periods."},{"id":"24-c","pref":"24","kind":"capital","xy":[441.1,693.6],"wiki":"Tsu, Mie","pop":273267,"popYear":2020,"note":"Small port city; the prefecture's best-known sights are at Ise and Suzuka.","summary":"Tsu is the capital city of Mie Prefecture, Japan. Although the second largest city in the prefecture in terms of population (behind Yokkaichi), its designation as the prefectural capital and its holding of a large concentration of national government offices and educational facilities make the city the administrative and educational center of Mie Prefecture."},{"id":"24-0","pref":"24","kind":"sight","i":0,"xy":[452,709.2],"ja":"伊勢神宮","wiki":"Ise Shrine","summary":"The Ise Shrine, located in Ise, Mie Prefecture of Japan, is a Shinto shrine dedicated to the solar goddess Amaterasu Ōmikami and the grain goddess Toyouke-hime. Also known simply as Jingū, Ise Shrine is a shrine complex composed of many Shinto shrines centered on two main shrines, Naikū and Gekū."},{"id":"24-1","pref":"24","kind":"sight","i":1,"xy":[451.9,708.8],"ja":"おかげ横丁","wiki":"Ise, Mie","wikiBroader":true},{"id":"24-2","pref":"24","kind":"sight","i":2,"xy":[423.3,691.8],"ja":"伊賀上野","wiki":"Iga, Mie","summary":"Iga is a city located in Mie Prefecture, Japan."},{"id":"24-3","pref":"24","kind":"sight","i":3,"xy":[455,705.9],"ja":"夫婦岩","wiki":"Meoto Iwa","summary":"Meoto Iwa, or Married Couple Rocks, are a kind of rock formation seen as religiously significant in Shinto. They are a subtype of Iwakura rock."},{"id":"24-4","pref":"24","kind":"sight","i":4,"xy":[457.9,707.5],"ja":"ミキモト真珠島","wiki":"Mikimoto Pearl Island","summary":"Mikimoto Pearl Island is a small island in Ise Bay, offshore Toba, Mie Prefecture, Japan. The island is known as the birthplace of cultured pearl aquaculture."},{"id":"24-5","pref":"24","kind":"sight","i":5,"xy":[442.8,686.2],"ja":"鈴鹿サーキット","wiki":"Suzuka Circuit","summary":"The Suzuka International Racing Course, a.k.a. the Suzuka Circuit, is a 5.807 km (3.608 mi) long motorsport race track located in Ino, Suzuka City, Mie Prefecture, Japan, and operated by Honda Mobilityland, a subsidiary of Honda Motor Co, Ltd. It has a capacity of 155,000."},{"id":"25-c","pref":"25","kind":"capital","xy":[409.3,675.9],"wiki":"Ōtsu","pop":342607,"popYear":2021,"note":"On the shore of Lake Biwa, with the temple Mii-dera and Hiei-zan above it.","summary":"Ōtsu is the capital city of Shiga Prefecture, Japan."},{"id":"25-0","pref":"25","kind":"sight","i":0,"xy":[420.2,661.8],"ja":"琵琶湖","wiki":"Lake Biwa","summary":"Lake Biwa is the largest freshwater lake in Japan. It is located entirely within Shiga Prefecture (west-central Honshu), northeast of the former capital city of Kyoto. Lake Biwa is an ancient lake, over 4 million years old."},{"id":"25-1","pref":"25","kind":"sight","i":1,"xy":[416.9,660.6],"ja":"白鬚神社","wiki":"Shirahige Shrine","summary":"Shirahige Jinja is a Shinto shrine in Takashima in Shiga Prefecture, Japan. The shrine is dedicated to Sarutahiko Okami. It is the head shrine of the Shirahige Shrines around the country."},{"id":"25-2","pref":"25","kind":"sight","i":2,"xy":[408.6,672.7],"ja":"延暦寺","wiki":"Enryaku-ji","summary":"Enryaku-ji is a Tendai monastery located on Mount Hiei in Ōtsu, overlooking Kyoto. It was first founded in 788 during the early Heian period (794–1185) by Saichō (767–822), also known as Dengyō Daishi, who introduced the Tendai sect of Mahayana Buddhism to Japan from China."},{"id":"25-3","pref":"25","kind":"sight","i":3,"xy":[428.6,660.5],"ja":"彦根城","wiki":"Hikone Castle","summary":"Hikone Castle is an Edo-period Japanese castle located in the city of Hikone, Shiga Prefecture, Japan. It is considered the most significant historical site in Shiga. The site has been protected as a National Historic Site since 1951."},{"id":"25-4","pref":"25","kind":"sight","i":4,"xy":[421.1,669.3],"ja":"近江八幡市","wiki":"Ōmihachiman","summary":"Ōmihachiman is a city located in Shiga Prefecture, Japan."},{"id":"25-5","pref":"25","kind":"sight","i":5,"xy":[417.5,682],"ja":"MIHO MUSEUM","wiki":"Miho Museum","summary":"The Miho Museum is an art museum located southeast of Kyoto, Japan, in the Shigaraki neighborhood of the city of Kōka, in Shiga Prefecture."},{"id":"26-c","pref":"26","kind":"capital","xy":[405.1,676.2],"wiki":"Kyoto","pop":1448964,"popYear":2022,"note":"Imperial capital for over 1,000 years, with some 1,600 temples and most of the UNESCO-listed sites of ancient Kyoto.","summary":"Kyoto, officially Kyoto City, is the capital city of Kyoto Prefecture in the Kansai region of Japan's largest and most populous island of Honshu. More than half (56.8%) of Kyoto Prefecture's population resides in the city."},{"id":"26-0","pref":"26","kind":"sight","i":0,"xy":[405.9,677.2],"ja":"清水寺","wiki":"Kiyomizu-dera","summary":"Kiyomizu-dera is a Buddhist temple located in eastern Kyoto, Japan. It belongs to the Kita-Hosso sect of Japanese Buddhism and its honzon is a hibutsu statue of Jūichimen Kannon. The temple's full name is Otowa-san Kiyomizu-dera."},{"id":"26-1","pref":"26","kind":"sight","i":1,"xy":[405.3,678.9],"ja":"伏見稲荷大社","wiki":"Fushimi Inari-taisha","summary":"Fushimi Inari-taisha is the head shrine of the kami Inari, located in Fushimi-ku, Kyoto, Japan. The shrine sits at the base of a mountain, also named Inari, which is 233 metres (764 ft) above sea level, and includes trails up the mountain to many smaller shrines which span 4 kilometres (2.5 mi) and take approximately 2 hours to walk up."},{"id":"26-2","pref":"26","kind":"sight","i":2,"xy":[403.1,674.6],"ja":"金閣寺","wiki":"Kinkaku-ji","summary":"Kinkaku-ji, officially named Rokuon-ji, is a Zen Buddhist temple in Kyoto, Japan and a tourist attraction. It is designated as a World Heritage Site, a National Special Historic Site, a National Special Landscape, and one of the 17 Historic Monuments of Ancient Kyoto."},{"id":"26-3","pref":"26","kind":"sight","i":3,"xy":[400.3,676],"ja":"嵐山","wiki":"Arashiyama","summary":"Arashiyama is a district on the western outskirts of Kyoto, Japan. It also refers to the mountain across the Ōi River, which forms a backdrop to the district. Arashiyama is a nationally designated historic site and place of scenic beauty."},{"id":"26-4","pref":"26","kind":"sight","i":4,"xy":[407,683.5],"ja":"平等院","wiki":"Byōdō-in","summary":"Byōdō-in is a Buddhist temple in the city of Uji in Kyoto Prefecture, Japan, built in the late Heian period. It is jointly a temple of the Jōdo-shū (Pure Land) and Tendai-shū (Heavenly Level) sects."},{"id":"26-5","pref":"26","kind":"sight","i":5,"xy":[377.3,642.9],"ja":"天橋立","wiki":"Amanohashidate","summary":"Amanohashidate is one of Japan's three scenic views. It is a sandbar located in Miyazu Bay in northern Kyoto Prefecture. It forms part of the Tango-Amanohashidate-Ōeyama Quasi-National Park."},{"id":"27-c","pref":"27","kind":"capital","xy":[392,695.1],"wiki":"Osaka","pop":2751862,"popYear":2021,"note":"Merchant city and \"Japan's kitchen\": Osaka Castle, Dōtonbori and street food.","summary":"Osaka is a designated city in the Kansai region of Honshu in Japan. It is the capital of and most populous city in Osaka Prefecture, and the third-most populous city proper in Japan, following the special wards of Tokyo and Yokohama."},{"id":"27-0","pref":"27","kind":"sight","i":0,"xy":[393.2,695.5],"ja":"大阪城","wiki":"Osaka Castle","summary":"Osaka Castle is a Japanese castle in Chūō-ku, Osaka, Japan. The castle is one of Japan's most famous landmarks and played a major role in the unification of Japan during the sixteenth century of the Azuchi–Momoyama period."},{"id":"27-1","pref":"27","kind":"sight","i":1,"xy":[392,696.6],"ja":"道頓堀","wiki":"Dōtonbori","summary":"Dōtonbori or Dōtombori is a district in Osaka, Japan. Known as one of Osaka's principal tourist and nightlife areas, the area runs along the Dōtonbori canal from Dōtonboribashi Bridge to Nipponbashi Bridge in the Namba district of the city's Chūō ward."},{"id":"27-2","pref":"27","kind":"sight","i":2,"xy":[392.7,697.4],"ja":"四天王寺","wiki":"Shitennō-ji","summary":"Shitennō-ji is a Buddhist temple in Ōsaka, Japan. It is also known as Arahaka-ji, Nanba-ji/Naniwa-daiji, or Mitsu-ji 御津寺. The temple is sometimes regarded as the first Buddhist and oldest officially administered temple in Japan, although the temple complex and buildings have been rebuilt over the centuries, with the last reconstruction taking place in 1963."},{"id":"27-3","pref":"27","kind":"sight","i":3,"xy":[391.5,699.9],"ja":"住吉大社","wiki":"Sumiyoshi-taisha","summary":"Sumiyoshi-taisha, also known as Sumiyoshi Grand Shrine, is a Shinto shrine in Sumiyoshi-ku, Osaka, Osaka Prefecture, Japan. It is the main shrine of all the Sumiyoshi shrines. It gives its name to a style of shrine architecture known as Sumiyoshi-zukuri."},{"id":"27-4","pref":"27","kind":"sight","i":4,"xy":[392.2,697.5],"ja":"新世界・通天閣","wiki":"Shinsekai","summary":"Shinsekai is a neighbourhood located next to south Osaka City's downtown \"Minami\" area. The neighbourhood was created in 1912 with New York (specifically, Coney Island) as a model for its southern half and Paris for its northern half. At this location, a Luna Park amusement park operated from 1912 until it closed in 1923."},{"id":"27-5","pref":"27","kind":"sight","i":5,"xy":[391.3,702.8],"ja":"大仙陵古墳","wiki":"Mozu Kofun Group","summary":"The Mozu Kofun Group is a group of kofun—megalithic tombs—in Sakai, Osaka Prefecture, Japan. Originally consisting of more than 100 tombs, fewer than 50% of the key-hole, round, and rectangular tombs remain."},{"id":"28-c","pref":"28","kind":"capital","xy":[377,695.2],"wiki":"Kobe","pop":1521707,"popYear":2021,"note":"Port city between the mountains and the sea, known for Kobe beef and its night view.","summary":"Kobe, officially Kobe City, is the capital city of Hyōgo Prefecture, Japan. With a population of around 1.5 million, Kobe is Japan's seventh-largest city and the third-largest port city after Tokyo and Yokohama. It is located in the Kansai region, which makes up the southern side of the main island of Honshū, on the north shore of Osaka Bay."},{"id":"28-0","pref":"28","kind":"sight","i":0,"xy":[352.6,686],"ja":"姫路城","wiki":"Himeji Castle","summary":"Himeji Castle is a hilltop Japanese castle complex situated in Himeji, a city in Hyōgo Prefecture, Japan. The castle is regarded as the finest surviving example of prototypical Japanese castle architecture, comprising a network of 83 structures with advanced defensive systems from the feudal period."},{"id":"28-1","pref":"28","kind":"sight","i":1,"xy":[359,639.5],"ja":"城崎温泉","wiki":"Kinosaki, Hyōgo","summary":"Kinosaki was a town in Kinosaki District, Hyōgo Prefecture, Japan."},{"id":"28-2","pref":"28","kind":"sight","i":2,"xy":[379.6,688.8],"ja":"有馬温泉","wiki":"Arima Onsen","summary":"Arima Onsen is an onsen, or hot spring resort in Kita-ku, Kobe, Japan, located near Mount Rokkō. This onsen attracts many Japanese because of its easy access from the busy cities in the Kansai metropolitan area including Osaka and Kobe. Arima Onsen was named in the Heian-period The Pillow Book as one of the three famous springs in Japan."},{"id":"28-3","pref":"28","kind":"sight","i":3,"xy":[359.5,658.7],"ja":"竹田城","wiki":"Takeda Castle","summary":"Takeda Castle was a Sengoku period Japanese castle located in the Wadayama neighborhood of the city of Asago, in the northern part of Hyōgo Prefecture, Japan. It is located north of Himeji, and north-west of Kyoto, and is situated some 353 metres above sea level It is often referred to locally as the \"Machu Picchu of Japan\"."},{"id":"28-4","pref":"28","kind":"sight","i":4,"xy":[376.8,694.6],"ja":"北野異人館街","wiki":"Kitano-chō","summary":"Kitano-chō or Kitano Ijinkan is a historical district in Kobe, Hyōgo Prefecture, Japan, which contains a number of foreign residences from the late Meiji and early Taishō eras of Japanese history."},{"id":"28-5","pref":"28","kind":"sight","i":5,"xy":[368.4,699.5],"ja":"明石海峡大橋","wiki":"Akashi Kaikyo Bridge","summary":"The Akashi Kaikyo Bridge is a suspension bridge that links the city of Kobe on the Japanese island of Honshu and Iwaya, Awaji on Awaji Island. It is part of the Kobe-Awaji-Naruto Expressway, and crosses the busy and turbulent Akashi Strait."},{"id":"29-c","pref":"29","kind":"capital","xy":[406.8,695.6],"wiki":"Nara (city)","pop":352377,"popYear":2021,"note":"Japan's capital in the 8th century; deer roam the park around Tōdai-ji.","summary":"Nara is the capital city of Nara Prefecture, Japan. Nara is a core city located in the northern part of Nara Prefecture bordering the Kyoto Prefecture."},{"id":"29-0","pref":"29","kind":"sight","i":0,"xy":[408.5,695.4],"ja":"東大寺","wiki":"Tōdai-ji","summary":"Tōdai-ji is a Buddhist temple complex that was once one of the powerful Seven Great Temples, located in the city of Nara, Japan. The construction of the temple was an attempt to imitate Chinese temples from the much-admired Tang dynasty. Though it was originally founded in the year 738 CE, Tōdai-ji was not opened until the year 752 CE."},{"id":"29-1","pref":"29","kind":"sight","i":1,"xy":[409,695.6],"ja":"奈良公園","wiki":"Nara Park","summary":"Nara Park is a public park located in the city of Nara, Japan, at the foot of Mount Wakakusa. Established in 1880, it is one of the oldest parks in Japan. Administratively, the park is under the control of Nara Prefecture."},{"id":"29-2","pref":"29","kind":"sight","i":2,"xy":[408.9,695.9],"ja":"春日大社","wiki":"Kasuga-taisha","summary":"Kasuga-taisha is a Shinto shrine in Nara, Nara Prefecture, Japan. It is the shrine of the Fujiwara family, established in 768 CE and rebuilt several times over the centuries. The interior is famous for its many bronze lanterns, as well as the many stone lanterns that lead up to the shrine."},{"id":"29-3","pref":"29","kind":"sight","i":3,"xy":[403.3,699.8],"ja":"法隆寺","wiki":"Hōryū-ji","summary":"Hōryū-ji is a Buddhist temple that was once one of the powerful Seven Great Temples, located in Ikaruga, Nara Prefecture, Japan. Built shortly after Buddhism was introduced to Japan, it is also one of the oldest Buddhist sites in the country."},{"id":"29-4","pref":"29","kind":"sight","i":4,"xy":[410,715.2],"ja":"吉野山","wiki":"Mount Yoshino","summary":"Mount Yoshino is the general name for the mountain ridge that stretches from the south bank of the Yoshino River in the town of Yoshino central Nara Prefecture, Japan, to the Ōmine Mountains, stretching for about eight kilometers from north-to-south, or the broader name of the area dotted with shrines and temples, centered around Kinpusen-ji Temple."},{"id":"29-5","pref":"29","kind":"sight","i":5,"xy":[407.6,708.4],"ja":"明日香村","wiki":"Asuka, Nara","summary":"Asuka is a village located in Takaichi District, Nara Prefecture, Japan."},{"id":"30-c","pref":"30","kind":"capital","xy":[375.6,722.5],"wiki":"Wakayama (city)","pop":353299,"popYear":2021,"note":"Castle town of a Tokugawa branch family on the Kii Peninsula.","summary":"Wakayama is the capital city of Wakayama Prefecture in the Kansai region of Japan."},{"id":"30-0","pref":"30","kind":"sight","i":0,"xy":[396,723.7],"ja":"高野山","wiki":"Mount Kōya","summary":"Mount Kōya is a large temple settlement in Wakayama Prefecture, Japan to the south of Osaka. In the strictest sense, Mount Kōya is the mountain name (sangō) of Kongōbu-ji Temple, the ecclesiastical headquarters of the Kōyasan sect of Shingon Buddhism."},{"id":"30-1","pref":"30","kind":"sight","i":1,"xy":[396.9,723.4],"ja":"奥之院","wiki":"Okunoin","summary":"Okunoin or Oku-no-in is a sacred Buddhist site and cemetery on Mount Kōya, in Wakayama Prefecture, Japan. Opened in 835, it houses the mausoleum of Kūkai, founder of the Shingon school of esoteric Buddhism. It is considered the largest cemetery in Japan, with more than two hundred thousand graves and memorial monuments."},{"id":"30-2","pref":"30","kind":"sight","i":2,"xy":[410.9,756.1],"ja":"熊野古道","wiki":"Kumano Kodō","summary":"The Kumano Kodō is a series of ancient pilgrimage routes that crisscross the Kii Peninsula, the largest peninsula of Japan. These mountainous trails are used by pilgrims to the \"Kumano Sanzan\" - the Three Grand Shrines of Kumano: Kumano Hongū Taisha, Kumano Nachi Taisha and Kumano Hayatama Taisha."},{"id":"30-3","pref":"30","kind":"sight","i":3,"xy":[411,755.9],"ja":"那智滝","wiki":"Nachi Falls","summary":"Nachi Falls in Nachikatsuura, Wakayama Prefecture, Japan, is one of the best-known waterfalls in Japan."},{"id":"30-4","pref":"30","kind":"sight","i":4,"xy":[383.9,755.3],"ja":"白浜町","wiki":"Shirahama, Wakayama","summary":"Shirahama is a town in Nishimuro District, Wakayama Prefecture, Japan."},{"id":"30-5","pref":"30","kind":"sight","i":5,"xy":[382.5,723.8],"ja":"貴志駅","wiki":"Kishi Station (Wakayama)","summary":"Kishi Station is a passenger railway station located in the city of Kinokawa, Wakayama Prefecture, Japan, operated by the private railway company Wakayama Electric Railway."},{"id":"31-c","pref":"31","kind":"capital","xy":[330.3,646.7],"wiki":"Tottori (city)","pop":187323,"popYear":2021,"note":"Small castle town beside the Tottori Sand Dunes.","summary":"Tottori is the capital and the largest city of Tottori Prefecture in the Chūgoku region of Japan. Most of the city is within the San'in Kaigan Geopark."},{"id":"31-0","pref":"31","kind":"sight","i":0,"xy":[330.7,644],"ja":"鳥取砂丘","wiki":"Tottori Sand Dunes","summary":"The Tottori Sand Dunes are sand dunes located outside the city center of Tottori in Tottori Prefecture, Japan. With a length of 9 miles (14 km) and a width of less than 1.5 miles (2.4 km), it is the largest sand dune in Japan. The sand dunes are part of the San'in Kaigan Geopark, which is part of the UNESCO Global Geoparks."},{"id":"31-1","pref":"31","kind":"sight","i":1,"xy":[331.2,644],"ja":"砂の美術館","wiki":"Tottori Sand Museum","summary":"The Tottori Sand Museum was opened on November 18, 2006, in Tottori, Japan, close to the Tottori Sand Dunes, displaying sand sculptures in temporary facilities. On April 14, 2012, it reopened as the world's first permanent indoor exhibition space dedicated to sand art, exhibiting works by fifteen international sculptors."},{"id":"31-2","pref":"31","kind":"sight","i":2,"xy":[297.5,653.3],"ja":"大山","wiki":"Mount Daisen","summary":"Mount Daisen is a dormant stratovolcano in Tottori Prefecture, Japan. It has an elevation of 1,729 m (5,673 ft). This mountain is the highest in the Chūgoku region, and the most important volcano on the Daisen volcanic belt, which is a part of the Southwestern Honshu volcanic arc, where the Philippine Sea Plate is subducting under the Amurian Plate."},{"id":"31-3","pref":"31","kind":"sight","i":3,"xy":[282.6,642.6],"ja":"水木しげるロード"},{"id":"31-4","pref":"31","kind":"sight","i":4,"xy":[317.3,652.1],"ja":"三徳山投入堂","wiki":"Sanbutsu-ji","summary":"Sanbutsu-ji is a Buddhist temple in the town of Misasa, Tottori Prefecture, Japan. The Nageire Hall of Sanbutsu-ji, built in the Heian period is designated a National Treasure of Japan."},{"id":"31-5","pref":"31","kind":"sight","i":5,"xy":[310.6,649.9],"ja":"倉吉市","wiki":"Kurayoshi, Tottori","summary":"Kurayoshi is a city located in the central part of Tottori Prefecture, Japan."},{"id":"32-c","pref":"32","kind":"capital","xy":[273.5,646.8],"wiki":"Matsue","pop":201802,"popYear":2021,"note":"The \"Water Capital\" between Lake Shinji and the sea, around an original castle keep.","summary":"Matsue is the capital city of Shimane Prefecture, Japan, located in the Chūgoku region of Honshu. Matsue is home to the Tokugawa-era Matsue Castle, one of the last surviving feudal castles in Japan."},{"id":"32-0","pref":"32","kind":"sight","i":0,"xy":[255.8,650.1],"ja":"出雲大社","wiki":"Izumo-taisha","summary":"Izumo-taisha, officially Izumo Ōyashiro, is one of the most ancient and important Shinto shrines in Japan. No record gives the date of establishment. Located in Izumo, Shimane Prefecture, it hosts two major festivals."},{"id":"32-1","pref":"32","kind":"sight","i":1,"xy":[273.6,646.4],"ja":"松江城","wiki":"Matsue Castle","summary":"Matsue Castle is a Japanese castle located in Matsue, Shimane Prefecture."},{"id":"32-2","pref":"32","kind":"sight","i":2,"xy":[280.4,652.3],"ja":"足立美術館","wiki":"Adachi Museum of Art","summary":"The Adachi Museum of Art opened in Yasugi, Shimane Prefecture, Japan in 1970. It houses a collection of nihonga, including paintings by Yokoyama Taikan, and has a celebrated garden."},{"id":"32-3","pref":"32","kind":"sight","i":3,"xy":[243.1,667.2],"ja":"石見銀山","wiki":"Iwami Ginzan Silver Mine","summary":"The Iwami Ginzan was an underground silver mine in the city of Ōda, in Shimane Prefecture on the main island of Honshu, Japan. It was the largest silver mine in Japanese history. It was active for almost four hundred years, from its discovery in 1526 to its closing in 1923."},{"id":"32-4","pref":"32","kind":"sight","i":4,"xy":[269.5,647.7],"ja":"宍道湖","wiki":"Lake Shinji","summary":"Lake Shinji is a brackish coastal lagoon in the northeast area of the Shimane Prefecture in Japan. It is considered to be the seventh largest lake in Japan, with a circumference of 48 kilometres (30 mi)."},{"id":"32-5","pref":"32","kind":"sight","i":5,"xy":[212.3,699.5],"ja":"津和野町","wiki":"Tsuwano, Shimane","summary":"Tsuwano is a town located in Kanoashi District, Shimane Prefecture, Japan. Popularly called the \"Little Kyoto of San'in,\" Tsuwano is known for its picturesque main street, \"Tono-machi,\" which is an Important Preservation District for Groups of Traditional Building lined with Edo period buildings and Koi ponds."},{"id":"33-c","pref":"33","kind":"capital","xy":[314.6,696.3],"wiki":"Okayama","pop":720043,"popYear":2021,"note":"Home of Kōraku-en garden and the black \"Crow Castle\".","summary":"Okayama is the capital city of Okayama Prefecture in the Chūgoku region of Japan. The Okayama metropolitan area, centered around the city, has the largest urban employment zone in the Chugoku region of western Japan. The city was founded on June 1, 1889."},{"id":"33-0","pref":"33","kind":"sight","i":0,"xy":[315.3,695.5],"ja":"後楽園","wiki":"Kōraku-en","summary":"Kōraku-en is a Japanese garden located in Okayama, Okayama Prefecture. It is one of the Three Great Gardens of Japan, along with Kenroku-en and Kairaku-en. Korakuen was built in 1700 by Ikeda Tsunamasa, lord of Okayama."},{"id":"33-1","pref":"33","kind":"sight","i":1,"xy":[315.4,695.7],"ja":"岡山城","wiki":"Okayama Castle","summary":"Okayama Castle is a Japanese castle in the city of Okayama in Okayama Prefecture in Japan. The main tower was completed in 1597, destroyed in 1945 and replicated in concrete in 1966. Two of the watch towers survived the bombing of 1945 and are now listed by the national Agency for Cultural Affairs as Important Cultural Properties."},{"id":"33-2","pref":"33","kind":"sight","i":2,"xy":[307.2,699.7],"ja":"倉敷美観地区","wiki":"Kurashiki","wikiBroader":true},{"id":"33-3","pref":"33","kind":"sight","i":3,"xy":[307.2,699.6],"ja":"大原美術館","wiki":"Ohara Museum of Art","summary":"The Ohara Museum of Art in Kurashiki was the first collection of Western art to be permanently exhibited in Japan. The museum opened in 1930 and originally consisted almost entirely of French paintings and sculptures of the 19th and 20th centuries."},{"id":"33-4","pref":"33","kind":"sight","i":4,"xy":[300.3,686.8],"ja":"備中松山城","wiki":"Bitchū Matsuyama Castle","summary":"Bitchū Matsuyama Castle, also known as Takahashi Castle, is a Japanese castle located in the city of Takahashi, Okayama Prefecture, in the San'yō region of Japan."},{"id":"33-5","pref":"33","kind":"sight","i":5,"xy":[311.2,695.3],"ja":"吉備津神社","wiki":"Kibitsu Shrine (Bitchū)","summary":"Kibitsu Jinja is a Shinto shrine in the Kibitsu neighborhood of Kita-ku, Okayama in Okayama Prefecture, Japan. It is the ichinomiya (first shrine) of former Bitchū Province. The shrine's main festivals are held on the second Sunday in May and October 15 each year."},{"id":"34-c","pref":"34","kind":"capital","xy":[242.3,710.1],"wiki":"Hiroshima","pop":1198021,"popYear":2021,"note":"Rebuilt after the 1945 atomic bombing; the Peace Memorial Park is at its heart.","summary":"Hiroshima is the capital of Hiroshima Prefecture in Japan. The gross domestic product (GDP) in Greater Hiroshima, Hiroshima Urban Employment Area, was US$61.3 billion as of 2010. Kazumi Matsui has been the city's mayor since April 2011."},{"id":"34-0","pref":"34","kind":"sight","i":0,"xy":[242.3,709.5],"ja":"原爆ドーム・平和記念公園","wiki":"Hiroshima Peace Memorial","summary":"The Hiroshima Peace Memorial, originally the Hiroshima Prefectural Industrial Promotion Hall, and now commonly called the Genbaku Dome, Atomic Bomb Dome or A-Bomb Dome, is part of Hiroshima Peace Memorial Park in Hiroshima, Japan, and was designated a UNESCO World Heritage Site in 1996."},{"id":"34-1","pref":"34","kind":"sight","i":1,"xy":[234.8,716.4],"ja":"厳島神社","wiki":"Itsukushima Shrine","summary":"Itsukushima Shrine is a Shinto shrine on the island of Itsukushima (popularly known as Miyajima), best known for its \"floating\" torii. It is in the city of Hatsukaichi, in Hiroshima Prefecture in Japan, accessible from the mainland by ferry at Miyajimaguchi Station."},{"id":"34-2","pref":"34","kind":"sight","i":2,"xy":[278.9,711.3],"ja":"しまなみ海道","wiki":"Nishiseto Expressway","summary":"The Nishiseto Expressway, often called the Shimanami Kaidō, is an expressway in Japan that connects Onomichi, Hiroshima and Imabari, Ehime, going through nine of the Geiyo Islands, including Ōshima, Ōmishima, and Innoshima."},{"id":"34-3","pref":"34","kind":"sight","i":3,"xy":[278.9,709.5],"ja":"尾道市","wiki":"Onomichi","summary":"Onomichi is a city located in Hiroshima Prefecture, Japan."},{"id":"34-4","pref":"34","kind":"sight","i":4,"xy":[247,718.9],"ja":"呉市海事歴史科学館","wiki":"Yamato Museum","summary":"The Yamato Museum is the nickname of the Kure Maritime Museum in Kure, Hiroshima, Japan."},{"id":"34-5","pref":"34","kind":"sight","i":5,"xy":[287.7,711.9],"ja":"鞆の浦","wiki":"Tomonoura","summary":"Tomonoura, formerly known as Tomonotsu, is a port in the Tomo ward of Fukuyama, Hiroshima Prefecture, Japan. It stands on the southern point of the Numakuma Peninsula, 14 kilometers south of Fukuyama Station, with a population of about 3,500 people as of 2017."},{"id":"35-c","pref":"35","kind":"capital","xy":[193.6,720.3],"wiki":"Yamaguchi (city)","pop":193761,"popYear":2021,"note":"Called the \"Kyoto of the West\", with the five-storey pagoda at Rurikō-ji.","summary":"Yamaguchi is the capital city of Yamaguchi Prefecture, Japan."},{"id":"35-0","pref":"35","kind":"sight","i":0,"xy":[228.2,722.5],"ja":"錦帯橋","wiki":"Kintai Bridge","summary":"Kintai Bridge is a historical wooden arch bridge in the city of Iwakuni in Yamaguchi Prefecture, Japan."},{"id":"35-1","pref":"35","kind":"sight","i":1,"xy":[185.3,716.7],"ja":"秋吉台国定公園","wiki":"Akiyoshidai Quasi-National Park","summary":"Akiyoshidai Kokutei Kōen is a Quasi-National Park in Yamaguchi Prefecture, Japan. It was founded on 1 November 1955 and has an area of 45.02 km²."},{"id":"35-2","pref":"35","kind":"sight","i":2,"xy":[174.1,704.9],"ja":"元乃隅神社"},{"id":"35-3","pref":"35","kind":"sight","i":3,"xy":[190.6,706.5],"ja":"萩市","wiki":"Hagi, Yamaguchi","summary":"Hagi is a city located in Yamaguchi Prefecture, Japan. It is known for being the birthplace of Hagi ware, a type of Japanese pottery."},{"id":"35-4","pref":"35","kind":"sight","i":4,"xy":[193.6,719.6],"ja":"瑠璃光寺","wiki":"Rurikō-ji","summary":"Rurikō-ji is a Buddhist temple located in the Kozan neighborhood of the city of Yamaguchi, Yamaguchi Prefecture, Japan. The temple belongs to the Sōtō school of Japanese Zen sect and its honzon is a statue of Yakushi Nyorai. The temple's full name is Honeizan Rurikōzen-ji."},{"id":"35-5","pref":"35","kind":"sight","i":5,"xy":[165.3,708.4],"ja":"角島大橋","wiki":"Tsunoshima Bridge","summary":"Tsunoshima Bridge is a bridge located in Yamaguchi Prefecture, Japan. The 1,780 m (5,840 ft) bridge connects the island of Tsunoshima to mainland Japan."},{"id":"36-c","pref":"36","kind":"capital","xy":[345.1,731.7],"wiki":"Tokushima (city)","pop":254510,"popYear":2020,"note":"Holds the Awa Odori dance festival every August.","summary":"Tokushima is the capital city of Tokushima Prefecture on Shikoku island in Japan."},{"id":"36-0","pref":"36","kind":"sight","i":0,"xy":[344.6,731.7],"ja":"阿波おどり","wiki":"Awa Dance Festival","summary":"The Awa Dance Festival is held from 12 to 15 August as part of the Obon festival in Tokushima Prefecture on Shikoku in Japan. Awa Odori is the largest dance festival in Japan, attracting over 540 thousand tourists every year."},{"id":"36-1","pref":"36","kind":"sight","i":1,"xy":[349.9,721.8],"ja":"鳴門の渦潮","wiki":"Naruto whirlpools","summary":"The Naruto whirlpools are tidal whirlpools in the Naruto Strait, a channel between Naruto in Tokushima and Awaji Island in Hyōgo, Japan. The strait between Naruto and Awaji island has a width of about 1.3 km (0.81 miles)."},{"id":"36-2","pref":"36","kind":"sight","i":2,"xy":[309.4,742.6],"ja":"祖谷渓","wiki":"Iya Valley","summary":"The Iya Valley region in Tokushima Prefecture, Japan is a scenic area known for its mountain valleys, thatched roof farmhouses and historic Vine Bridges. Although access has improved in recent years, the Iya Valley and the inner parts of Shikoku have historically been remote and difficult to enter."},{"id":"36-3","pref":"36","kind":"sight","i":3,"xy":[349.2,722.1],"ja":"大塚国際美術館","wiki":"Ōtsuka Museum of Art","summary":"The Ōtsuka Museum of Art in Naruto, Tokushima Prefecture is an art museum founded in 1998 and is one of the largest exhibition spaces in Japan."},{"id":"36-4","pref":"36","kind":"sight","i":4,"xy":[342.6,726.3],"ja":"霊山寺","wiki":"Ryōzen-ji (Naruto)","summary":"Ryōzen-ji is a Shingon Buddhist temple in Naruto, Tokushima Prefecture, Japan best known as the first temple of the Shikoku pilgrimage. It is associated with the Kōyasan sect and dedicated to Shaka Nyorai."},{"id":"36-5","pref":"36","kind":"sight","i":5,"xy":[325.4,731.5],"ja":"脇町 うだつの町並み","wiki":"Mima, Tokushima","wikiBroader":true},{"id":"37-c","pref":"37","kind":"capital","xy":[320.4,715],"wiki":"Takamatsu","pop":417814,"popYear":2020,"note":"Port on the Inland Sea, gateway to the art islands and the home of sanuki udon.","summary":"Takamatsu is the capital city of Kagawa Prefecture, Japan. It is the capital city of the prefecture."},{"id":"37-0","pref":"37","kind":"sight","i":0,"xy":[320.2,715.8],"ja":"栗林公園","wiki":"Ritsurin Garden","summary":"Ritsurin Garden is a large, historic garden in Takamatsu, Japan. It was completed in 1745 as a private strolling garden and villa for the local feudal lords, and opened to the public in 1875. Ritsurin is one of the largest strolling gardens in Japan, and a major tourist attraction for Kagawa Prefecture."},{"id":"37-1","pref":"37","kind":"sight","i":1,"xy":[308.5,724.2],"ja":"金刀比羅宮","wiki":"Kotohira-gū","summary":"Kotohira-gū is a Shinto shrine in the town of Kotohira in Kagawa Prefecture, Japan. Prior to the separation of Shinto and Buddhism in the Meiji era, its name was Konpira Daigongen. The shrine is believed to be a guardian of sailors and fishermen, though its faith also has aspects of mountain worship due to its location on the holy Mount Zōzu."},{"id":"37-2","pref":"37","kind":"sight","i":2,"xy":[318,708],"ja":"直島","wiki":"Naoshima","summary":"Naoshima is an island in Japan's Seto Inland Sea, part of Kagawa Prefecture. The island is best known for its many contemporary art installations and museums. The Town of Naoshima administers Naoshima and 26 smaller islands nearby."},{"id":"37-3","pref":"37","kind":"sight","i":3,"xy":[329.7,706.8],"ja":"小豆島","wiki":"Shōdoshima","summary":"Shōdoshima or Shōdo Island is an island located in the Inland Sea of Japan. The name means \"Island of Small Beans\". There are two towns on the island: Tonoshō and Shōdoshima, composing the district of Shōzu."},{"id":"37-4","pref":"37","kind":"sight","i":4,"xy":[306.8,721.7],"ja":"善通寺","wiki":"Zentsū-ji","summary":"The Byōbuura Gogakusan Tanjō-in Zentsū-ji is a Buddhist temple of the Shingon sect in Zentsūji, Kagawa, Japan. It was established in 807 by Kūkai, founder of Shingon Buddhism, who was born where the temple now stands. The oldest structure, the Shakadō Hall, dates to around 1677."},{"id":"37-5","pref":"37","kind":"sight","i":5,"xy":[299.2,721.9],"ja":"父母ヶ浜","wiki":"Mitoyo, Kagawa","wikiBroader":true},{"id":"38-c","pref":"38","kind":"capital","xy":[256.4,743.2],"wiki":"Matsuyama","pop":506743,"popYear":2021,"note":"Castle town with the hot spring Dōgo Onsen, one of Japan's oldest.","summary":"Matsuyama is the capital city of Ehime Prefecture, on the island of Shikoku, in Japan and is also Shikoku's largest city."},{"id":"38-0","pref":"38","kind":"sight","i":0,"xy":[257.5,742.5],"ja":"道後温泉本館","wiki":"Dōgo Onsen","summary":"Dōgo Onsen is a hot spring in the city of Matsuyama, Ehime Prefecture on the island of Shikoku, Japan."},{"id":"38-1","pref":"38","kind":"sight","i":1,"xy":[256.4,742.8],"ja":"松山城","wiki":"Matsuyama Castle (Iyo)","summary":"Matsuyama Castle is a \"flatland-mountain\"-style Japanese castle that was built in 1603 on Mount Katsuyama, in the city of Matsuyama in Ehime Prefecture, Japan. The castle is one of twelve Japanese castles to still have its original tenshu. The castle has been protected as a National Historic Site since 1952."},{"id":"38-2","pref":"38","kind":"sight","i":2,"xy":[268.5,730],"ja":"しまなみ海道","wiki":"Nishiseto Expressway","summary":"The Nishiseto Expressway, often called the Shimanami Kaidō, is an expressway in Japan that connects Onomichi, Hiroshima and Imabari, Ehime, going through nine of the Geiyo Islands, including Ōshima, Ōmishima, and Innoshima."},{"id":"38-3","pref":"38","kind":"sight","i":3,"xy":[250,761.2],"ja":"内子町","wiki":"Uchiko, Ehime","summary":"Uchiko is a town located in Kita District, Ehime Prefecture, Japan."},{"id":"38-4","pref":"38","kind":"sight","i":4,"xy":[244.7,762.5],"ja":"大洲城","wiki":"Ōzu Castle","summary":"Ōzu Castle, also known as Jizōgatake Castle, is a castle located in Ōzu, Ehime Prefecture, Japan. The earliest recorded defensive structures date back to the beginning of the 14th century and were supposedly built by Utsunomiya Toyofusa."},{"id":"38-5","pref":"38","kind":"sight","i":5,"xy":[266.3,764.9],"ja":"四国カルスト"},{"id":"39-c","pref":"39","kind":"capital","xy":[293.8,761],"wiki":"Kōchi, Kōchi","pop":325535,"popYear":2021,"note":"Former Tosa castle town, home of Sakamoto Ryōma and the Yosakoi dance.","summary":"Kōchi is the capital city of Kōchi Prefecture located on the island of Shikoku in Japan. With over 40% of the prefectural population, Kōchi is the main commercial and industrial centre and the \"primate city\" of the prefecture."},{"id":"39-0","pref":"39","kind":"sight","i":0,"xy":[293.8,761],"ja":"高知城","wiki":"Kōchi Castle","summary":"Kōchi Castle is an Edo Period Japanese castle in the city of Kōchi, Kōchi Prefecture, Japan. It is located at Otakayama hill, at the center of Kōchi city, which in turn is located at the center of the Kōchi Plain, the most prosperous area of former Tosa Province on the island of Shikoku."},{"id":"39-1","pref":"39","kind":"sight","i":1,"xy":[295.8,764.8],"ja":"桂浜","wiki":"Katsurahama"},{"id":"39-2","pref":"39","kind":"sight","i":2,"xy":[266,797.5],"ja":"四万十川","wiki":"Shimanto River","summary":"The Shimanto River is a Class A river in western Kōchi Prefecture, Japan. 196 km (122 mi) in length, it has a watershed of 2,270 km2 (880 sq mi)."},{"id":"39-3","pref":"39","kind":"sight","i":3,"xy":[266.9,810],"ja":"足摺岬","wiki":"Cape Ashizuri","summary":"Cape Ashizuri is a headland at the southernmost tip of the Japanese island of Shikoku, in the city of Tosashimizu, Kōchi Prefecture. The promontory extends into the Pacific Ocean and is situated within Ashizuri-Uwakai National Park."},{"id":"39-4","pref":"39","kind":"sight","i":4,"xy":[293.8,761],"ja":"よさこい祭り","wiki":"Yosakoi","summary":"Yosakoi is a unique style of dance that originated in Japan and that is performed at festivals and events all over the country. The first yosa   return `<details class="record"${recordOpen ? ' open' : ''}>
    <summary><span>Your record</span><span class="best">${played} of ${scopes.length * types.length} played</span></summary>
    <table><thead><tr><th scope="col"><span class="sr-only">Region</span></th>${types.map(t => `<th scope="col" class="num${t === setup.type ? ' on' : ''}">${QTYPES[t].title}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table>
  </details>`;
}
function quizRunHTML() {
  const t = byId[Q.current];
  let body = '';
  if (Q.type === 'find') {
    body = `<div class="prompt"><div class="big" lang="ja">${esc(t.ja)}</div><div class="sub">${esc(t.en)}</div><p class="context">Find it on the map.</p></div>
      <div class="feedback ${Q.fbClass}" id="feedback" aria-live="polite">${esc(Q.feedback)}</div>
      <div class="row"><button type="button" class="btn" id="skip">Show me &amp; skip</button></div>`;
  } else if (Q.type === 'name') {
    body = `<div class="prompt"><div class="sub">Which prefecture is circled on the map?</div></div>
      ${Q.answer === 'choice'
        ? `<div class="answers" id="answers">${Q.choices.map((id, i) => `<button type="button" data-id="${id}"><span class="k">${i + 1}</span><b>${esc(byId[id].en)}</b><span lang="ja">${esc(byId[id].ja)}</span></button>`).join('')}</div>`
        : `<form class="typein" id="typein" autocomplete="off"><input id="answer" aria-label="Prefecture name" placeholder="Type the name…" autocapitalize="off" spellcheck="false"><button class="btn primary" type="submit">Check</button></form>
           <div class="row"><button type="button" class="btn ghost small" id="skip">I don't know</button></div>`}
      <div class="feedback ${Q.fbClass}" id="feedback" aria-live="polite">${esc(Q.feedback)}</div>`;
  } else {
    body = `<form class="typein" id="typein" autocomplete="off"><input id="answer" aria-label="Prefecture name" placeholder="Type a prefecture…" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Add</button></form>
      <div class="feedback ${Q.fbClass}" id="feedback" aria-live="polite">${esc(Q.feedback)}</div>
      <div class="regions-left" id="regions-left"></div>
      <div class="row"><button type="button" class="btn" id="giveup">Give up &amp; show the rest</button></div>`;
  }
  return `<div class="panel-inner">
    <div class="status">
      <div class="progress" id="progress"><span class="txt"></span><div class="track"><div class="fill" style="transform:scaleX(0)"></div></div></div>
      <span class="clock" id="clock">${mmss(Date.now() - Q.t0)}</span>
      <button type="button" class="btn small" id="quit">Quit</button>
    </div>
    ${body}
    <p class="context">${esc(QTYPES[Q.type].title)} · ${esc(Q.practice ? 'Practice your misses' : scopeLabel(Q.scopeKey))}</p>
  </div>`;
}
function quizDoneHTML() {
  const r = Q.result, perfect = r.correct === r.total;
  const stamp = perfect && (r.total >= 7 || Q.type === 'all' || Q.answer === 'type');   // the hanko is kept for rounds that took real recall
  const seen = new Set(Object.values(Q.status));
  const key = [seen.has('found') && 'green is right first time', seen.has('late') && 'yellow is found after a miss', seen.has('missed') && 'red hatching is missed'].filter(Boolean).join(', ');
  const missed = [...new Set(Q.misses)];
  const missGroups = REGIONS.map(g => [g, missed.filter(id => byId[id].region === g.key)]).filter(([, ids]) => ids.length)
    .map(([g, ids]) => `<div class="missgroup"><span>${esc(g.key)} <span lang="ja">${esc(g.ja)}</span> · ${ids.length}</span><div class="misslist">${ids.map(id => `<button type="button" data-open="${id}">${esc(byId[id].en)} <span lang="ja">${esc(byId[id].ja)}</span></button>`).join('')}</div></div>`).join('');
  const missBtns = missed.length ? `<div class="missgroups">${missGroups}</div>` : '';
  const prev = r.prevBest;
  let bestLine = Q.gaveUp ? 'Given up, so this round is not saved as a best score. The misses below are a good place to start.' : Q.practice ? 'Practice round — not counted for best scores.' : (!prev ? 'First score saved for this game.' : (r.pct > prev.pct || (r.pct === prev.pct && r.ms < prev.ms)) ? `New best! Previous: ${prev.pct}% in ${mmss(prev.ms)}.` : `Best so far: ${prev.pct}% in ${mmss(prev.ms)}.`);
  return `<div class="panel-inner">
    <div class="result">
      <div><div class="score">${r.correct}<small> / ${r.total}</small></div><div class="muted">${perfect && !stamp ? 'A perfect round · ' : ''}${r.pct}% ${Q.type === 'all' ? 'named' : 'right on the first try'} · ${mmss(r.ms)}</div><p class="context">${esc(QTYPES[Q.type].title)} · ${esc(Q.practice ? 'Practice your misses' : scopeLabel(Q.scopeKey))}</p></div>
      ${stamp ? `<div class="hanko-wrap"><div class="hanko" lang="ja" role="img" aria-label="全問正解, perfect score">全問<br>正解</div><span>Perfect score</span></div>` : ''}
    </div>
    <p class="muted" style="margin:0">${esc(bestLine)}</p>
    <div class="row">
      <button type="button" class="btn primary" id="again">Play again</button>
      ${missBtns ? `<button type="button" class="btn" id="practice">Practice the ${missed.length} ${missed.length === 1 ? 'miss' : 'misses'}</button>` : ''}
      <button type="button" class="btn ghost" id="settings">Change game</button>
    </div>
    ${!missBtns ? '' : missed.length > 12
      ? `<details class="field misses"><summary>Review the ${missed.length} misses: choose a name to read about it</summary>${missBtns}</details>`
      : `<div class="field"><span class="lbl">Choose a name to read about it</span>${missBtns}</div>`}
    ${key ? `<p class="note">On the map, ${key}.</p>` : ''}
  </div>`;
}
/* destructive quiz exits ask once, inline: the first click arms the button for 3 seconds */
function twoStep(btn, ask, act, needed = () => true) {
  let armed = 0;
  const label = btn.textContent;
  btn.onclick = () => {
    if (armed || !needed()) { clearTimeout(armed); act(); return; }
    btn.textContent = ask; btn.classList.add('confirm');
    armed = setTimeout(() => { armed = 0; btn.textContent = label; btn.classList.remove('confirm'); }, 3000);
  };
}
function renderQuiz() {
  const restore = rememberFocus();
  renderQuizPanel();
  restore();
}
function renderQuizPanel() {
  if (mode !== 'quiz') return;
  $('#layout').classList.toggle('quiz-live', !!(Q && Q.phase === 'running'));
  if (!Q) {
    panel.innerHTML = quizSetupHTML();
    panel.querySelectorAll('input[name="qtype"]').forEach(r => r.onchange = () => { setup.type = r.value; store.set('setup', setup); renderQuiz(); });
    $('#scope').onchange = e => { setup.scope = e.target.value; store.set('setup', setup); renderQuiz(); previewScope(); };
    panel.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => { setup.answer = b.dataset.answer; store.set('setup', setup); renderQuiz(); });
    $('#start').onclick = () => startQuiz();
    $('.record').ontoggle = e => { recordOpen = e.target.open; };
    panel.querySelectorAll('.record [data-scope]').forEach(b => b.onclick = () => {   // a cell picks that game in that scope
      const scope = b.dataset.scope, moved = scope !== setup.scope;
      setup.scope = scope; if (b.dataset.type) setup.type = b.dataset.type;
      store.set('setup', setup); renderQuiz(); if (moved) previewScope();
    });
    return;
  }
  if (Q.phase === 'running') {
    panel.innerHTML = quizRunHTML();
    twoStep($('#quit'), 'Quit? Press again', () => { clearInterval(timer); Q = null; renderQuiz(); paint(); previewScope(); }, () => Object.keys(Q.status).length > 0);
    if (Q.type === 'find') $('#skip').onclick = () => { if (Q.locked) return; Q.tries = 2; const t = byId[Q.current]; Q.status[Q.current] = 'missed'; Q.misses.push(Q.current); Q.reveal = Q.current; Q.locked = true; feedback(`${t.en} is the one circled.`, 'bad'); paint(); updateProgress(); nextAfter(1700); };
    if (Q.type === 'name') {
      if (Q.answer === 'choice') panel.querySelectorAll('#answers button').forEach(b => b.onclick = () => nameAnswer(b.dataset.id));
      else {
        $('#typein').onsubmit = e => {
          e.preventDefault();
          const v = $('#answer').value; if (!v.trim()) return;
          const id = matchName(v);
          if (!id) {                                                             // a typo is not a wrong answer
            const near = nearName(v);
            if (near) suggestFix(`“${v.trim()}” isn't a prefecture name. Did you mean ${byId[near].en}?`, near, () => nameAnswer(near));
            else feedback(`“${v.trim()}” isn't a prefecture name. Check the spelling, or type it in kanji or kana.`, 'bad');
            return;
          }
          nameAnswer(id);
        };
        $('#skip').onclick = () => nameAnswer(null);
      }
    }
    if (Q.type === 'all') {
      const inp = $('#answer');
      inp.oninput = () => allInput(inp.value, false);
      $('#typein').onsubmit = e => { e.preventDefault(); allInput(inp.value, true); };
      twoStep($('#giveup'), 'End the round? Press again', giveUp);
      renderRegionsLeft();
      inp.focus({ preventScroll: true });
    }
    updateProgress();
    return;
  }
  panel.innerHTML = quizDoneHTML();
  $('#again').onclick = () => startQuiz();
  if ($('#practice')) $('#practice').onclick = () => startQuiz({ pool: [...new Set(Q.misses)] });
  $('#settings').onclick = () => { Q = null; renderQuiz(); paint(); previewScope(); };
  panel.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { setMode('explore'); selectPref(b.dataset.open, { zoom: true }); });
}
function previewScope() {
  if (mode !== 'quiz' || Q) return;
  paint();
  if (setup.scope === 'all') resetView(); else fitBox(unionBox(scopeIds(setup.scope)), 0.08);
}
document.addEventListener('keydown', e => {
  if (mode !== 'quiz' || !Q || Q.phase !== 'running' || Q.type !== 'name' || Q.answer !== 'choice') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4 && Q.choices[n - 1]) nameAnswer(Q.choices[n - 1]);
});

/* ================= modes ================= */
function setMode(m) {
  mode = m; store.set('mode', m);
  $('#mode-explore').setAttribute('aria-pressed', String(m === 'explore'));
  $('#mode-quiz').setAttribute('aria-pressed', String(m === 'quiz'));
  $('#layout').classList.toggle('quiz-live', m === 'quiz' && !!(Q && Q.phase === 'running'));
  $('#layout').classList.toggle('explore', m === 'explore');
  if (m !== 'explore') { drawerOpen = false; $('#layout').classList.remove('drawer-open'); }
  hideTip(); renderNames(); renderLegend(); renderPick(); renderCallout();
  setLabelText();
  paint();
  if (m === 'explore') renderExplore();
  else { renderQuiz(); previewScope(); }
}
$('#mode-explore').onclick = () => setMode('explore');
$('#mode-quiz').onclick = () => setMode('quiz');

/* ================= boot ================= */
// saved settings come from older versions too: anything this version does not know falls back to its default
if (!TABS.some(([k]) => k === tab)) tab = 'overview';
if (!['off', 'romaji', 'kanji'].includes(names)) names = 'off';
if (!QTYPES[setup.type]) setup.type = 'find';
if (setup.scope !== 'all' && !REGION[setup.scope]) setup.scope = 'all';
if (!['choice', 'type'].includes(setup.answer)) setup.answer = 'choice';
setLabelText();
setView(BASE);
if (sel) gPrefs.appendChild(prefEl[sel]);
setMode(mode === 'quiz' ? 'quiz' : 'explore');
})();
</script>

</body>
