<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn Japan's 47 prefectures with map quizzes and a clickable explorer.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Todōfuken Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='10' fill='%23cc4a2c'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Hiragino Mincho ProN,Yu Mincho,Noto Serif JP,serif' font-weight='700' font-size='40' fill='%23fff'%3E%E9%83%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: Explore is a full-width map whose selected prefecture speaks through an anchored callout card, with the reading in a drawer;
   Quiz keeps the map beside a docked panel. On phones the card sits under the map and the drawer becomes a bottom sheet. */
:root {
  --bg: #e8edf0;        /* page ground, cool washi grey */
  --surface: #fbfcfc;   /* panel paper */
  --sea: #d3dfe7;
  --grat: #b9c9d5;      /* graticule lines */
  --land: #f8f7f2;      /* neutral land for quizzes */
  --edge: #75828e;      /* prefecture borders, 3:1 on --land */
  --ink: #1b2230;       /* sumi with an indigo bias */
  --muted: #5a6474;
  --rule: #d2dae0;
  --ai: #284a8b;        /* 藍 indigo — UI accent */
  --ai-soft: #e3e9f4;
  --ai-ink: #ffffff;
  --shu: #cc4a2c;       /* 朱 vermilion — selection and seals */
  --halo: #fbfcfc;
  --ok: #26754a; --bad: #b5372a;
  --ok-fill: #a5d6b5; --late-fill: #f0d48e; --bad-fill: #dc7a68;
  --hover: brightness(.92);
  --r-hokkaido: #9dd1c5; --r-tohoku: #c8db8b; --r-kanto: #f2cd74; --r-chubu: #c0b4eb;
  --r-kansai: #f3b6c6; --r-chugoku: #f4b582; --r-shikoku: #9dd3a5; --r-kyushu: #eca394;
  --sep: #6c7884;       /* prefecture borders on the coloured explore map */

  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
  --radius: 12px;
  --shadow-float: 0 12px 32px rgb(15 23 42 / .16);    /* things that float over the map: callout */
  --shadow-drawer: 0 18px 48px rgb(15 23 42 / .22);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);       /* responses: press, enter, fill */
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);   /* things travelling across the screen */
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);    /* the phone bottom sheet, iOS-like */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1118; --surface: #121a24; --sea: #0f1824; --grat: #1d2b3b; --land: #283345; --edge: #7a8ca6;
    --ink: #e6ebf1; --muted: #9aa6b5; --rule: #243142; --ai: #8fb1f0; --ai-soft: #1b2a44; --ai-ink: #0b1118;
    --shu: #ff7b5a; --halo: #121a24;
    --ok: #62cc90; --bad: #ff7567; --ok-fill: #2d6946; --late-fill: #76622a; --bad-fill: #b04e43;
    --hover: brightness(1.25);
    --shadow-float: 0 12px 32px rgb(0 0 0 / .55); --shadow-drawer: 0 18px 48px rgb(0 0 0 / .6);
    --r-hokkaido: #3f8f87; --r-tohoku: #7f9a43; --r-kanto: #b8923a; --r-chubu: #7568b5;
    --r-kansai: #b0587a; --r-chugoku: #bb7443; --r-shikoku: #4a9660; --r-kyushu: #b15f55;
    --sep: #0b1118;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1118; --surface: #121a24; --sea: #0f1824; --grat: #1d2b3b; --land: #283345; --edge: #7a8ca6;
  --ink: #e6ebf1; --muted: #9aa6b5; --rule: #243142; --ai: #8fb1f0; --ai-soft: #1b2a44; --ai-ink: #0b1118;
  --shu: #ff7b5a; --halo: #121a24;
  --ok: #62cc90; --bad: #ff7567; --ok-fill: #2d6946; --late-fill: #76622a; --bad-fill: #b04e43;
  --hover: brightness(1.25);
  --shadow-float: 0 12px 32px rgb(0 0 0 / .55); --shadow-drawer: 0 18px 48px rgb(0 0 0 / .6);
  --r-hokkaido: #3f8f87; --r-tohoku: #7f9a43; --r-kanto: #b8923a; --r-chubu: #7568b5;
  --r-kansai: #b0587a; --r-chugoku: #bb7443; --r-shikoku: #4a9660; --r-kyushu: #b15f55;
  --sep: #0b1118;
  color-scheme: dark;
}

[hidden] { display: none !important; }   /* the legend and tool groups set display, which would otherwise beat the attribute */
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding-inline: 16px; padding-block: 12px 16px; box-sizing: border-box; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { display: contents; }   /* the page's title is the wordmark itself */
.brand-ja { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .06em; line-height: 1; }
.brand-en { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.modes { position: relative; isolation: isolate; display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
.modes button { border: 0; background: none; padding: 6px 18px; border-radius: 999px; cursor: pointer; font-weight: 500; }
.modes button[aria-pressed="true"] { background: var(--ai); color: var(--ai-ink); }
.modes-ink { display: none; }
/* the thumb is an indigo copy of both labels, clipped to one half: as the clip slides, text turns white exactly where indigo arrives */
@supports selector(:has(a)) {
  .modes-ink { position: absolute; inset: 3px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 999px; background: var(--ai); color: var(--ai-ink); font-weight: 500; pointer-events: none;
    clip-path: inset(0 50% 0 0 round 999px); transition: clip-path 250ms var(--ease-in-out); }
  .modes-ink span { display: grid; place-items: center; transition: transform 160ms var(--ease-out); }
  .modes:has(#mode-quiz[aria-pressed="true"]) .modes-ink { clip-path: inset(0 0 0 50% round 999px); }
  .modes button[aria-pressed="true"] { background: none; color: inherit; }
}

/* ---------- layout ---------- */
.layout { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 16px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; background: var(--sea); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.panel { min-height: 0; min-width: 0; overflow: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
.panel-inner { padding: 20px 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.panel-inner > *, .tabpanel > *, .field > * { min-width: 0; }

/* explore: the map owns the stage; the reading panel becomes a drawer over its right edge */
.layout.explore { grid-template-columns: minmax(0, 1fr); overflow: hidden; }   /* the closed drawer waits off-canvas without widening the page */
.layout.explore .panel { position: absolute; z-index: 6; top: 0; right: 0; bottom: 0; width: min(440px, 100%); box-shadow: var(--shadow-drawer); transform: translateX(calc(100% + 24px)); visibility: hidden; transition: transform 200ms var(--ease-out), visibility 0s 200ms; }   /* closing answers faster than opening */
.layout.explore.drawer-open .panel { transform: none; visibility: visible; transition: transform 300ms var(--ease-out); }
.drawer-bar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin: -6px 0 -4px; }

/* ---------- callout: the selected prefecture speaks from where it lies ---------- */
/* with the drawer open the card keeps only its head: the drawer carries the facts */
.layout.drawer-open .callout .co-tag, .layout.drawer-open .callout .co-facts { display: none; }
.callout { position: absolute; z-index: 4; left: 0; top: 0; width: 336px; display: grid; gap: 12px; padding: 16px 18px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow-float); overflow-y: auto; overscroll-behavior: contain; }
.callout.docked { transform: none !important; left: auto; right: 16px; top: auto; bottom: 16px; }   /* bottom-right is open Pacific, not Kyūshū */
.co-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: end; }
.co-kanji { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 48px; line-height: 1.05; letter-spacing: .04em; white-space: nowrap; }
.co-kanji.long { font-size: 40px; }   /* 九州・沖縄 still fits beside the close button */
.co-kanji.co-place.long { font-size: 34px; }
.co-kanji.co-place.longer { font-size: 26px; white-space: normal; text-wrap: balance; }   /* long landmark names may take two lines */
.co-place-title { margin: 0; font-size: 20px; }
.co-note { margin: 0; font-size: 15px; line-height: 1.5; font-weight: 500; }
.co-summary { margin: -4px 0 0; font-size: 14px; line-height: 1.55; }
.co-credit { margin: -8px 0 0; font-size: 12px; color: var(--muted); }
.co-credit a { color: inherit; }
.co-wiki { margin-left: auto; }
.co-wiki + .btn.primary { margin-left: 0; }
/* the map's own symbols, small, in the card that explains them */
.pmark { flex: none; display: inline-block; box-sizing: border-box; width: 11px; height: 11px; border-radius: 50%; }
.pmark.sight { background: var(--ai); }
.pmark.capital { border: 1.5px solid var(--ink); background: radial-gradient(circle, var(--ink) 0 2px, transparent 2.5px); }   /* taste-skill-ignore: ◎, the capital symbol, not decoration */
.placelink { padding: 0; border: 0; background: none; font: inherit; color: var(--ai); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; }
.items li.has-map { grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; }
.items li.has-map > :not(.onmap) { grid-column: 1; }
.items li.has-map .onmap { grid-column: 2; grid-row: 1 / span 2; align-self: center; gap: 6px; color: var(--ai); }
.co-name { grid-column: 1; font-size: 18px; font-weight: 700; line-height: 1.3; }
.co-name .kana { margin-left: 8px; font-size: 13px; font-weight: 400; color: var(--muted); }
.co-top { grid-row: 1; grid-column: 2; align-self: start; display: flex; align-items: center; gap: 4px; margin: -8px -10px 0 0; }   /* the close button, tucked into the corner */
.co-region { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 13px; color: var(--muted); }   /* its own line, so a long region never squeezes the kanji */
.co-close { min-width: 34px; padding-inline: 8px; }
.co-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 0; padding-top: 12px; border-top: 1px solid var(--rule); }
.co-facts dt { font-size: 12px; color: var(--muted); font-weight: 500; }   /* labels name the figure under them, in sentence case */
.co-facts dd { margin: 1px 0 0; font-size: 17px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
.co-facts dd small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.co-foot { display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--rule); }
.co-foot .btn.primary { margin-left: auto; }
.co-step { min-width: 34px; padding-inline: 8px; }
.ico { display: block; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.tool-group button .ico { margin: 0 auto; }
.co-sub { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.co-list { display: flex; flex-wrap: wrap; gap: 6px; }
.co-list button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; transition: border-color 150ms ease, transform 160ms var(--ease-out); }
.co-list button span { margin-left: 5px; color: var(--muted); }
.co-tag { margin: 0; font-size: 15px; line-height: 1.45; }
.co-hint { margin: 0; color: var(--muted); font-size: 15px; }
.leader { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.leader line { stroke: var(--ink); stroke-width: 1.25px; }
.leader circle { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5px; }

/* ---------- map ---------- */
#map { grid-row: 2; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.panning { cursor: grabbing; }
#map .sea { fill: var(--sea); }
#map .grat { fill: none; stroke: var(--grat); stroke-width: .8px; vector-effect: non-scaling-stroke; }
#map .inset-box { fill: var(--sea); stroke: var(--edge); stroke-width: 1px; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
#map .inset-cap { fill: var(--muted); font-size: 13px; font-family: var(--f-body); letter-spacing: .03em; }
#map .pref { cursor: pointer; transition: opacity 200ms ease; }
#map .shape { fill: var(--land); stroke: var(--edge); stroke-width: .7px; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: fill 200ms ease; }
#map .pref:focus { outline: none; }
/* keyboard focus is drawn as an outline path above every prefecture, so neighbours never cover it */
#map .focus-ring { fill: none; stroke: var(--ai); stroke-width: 3px; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .hit { fill: none; stroke: transparent; stroke-width: 14px; vector-effect: non-scaling-stroke; pointer-events: stroke; }
@media (hover: hover) and (pointer: fine) {
  #map:not(.panning) .pref:hover { filter: var(--hover); }
}

#map.m-explore .shape { stroke: var(--sep); stroke-width: .8px; }
#map.m-explore .pref[data-r="hokkaido"] .shape { fill: var(--r-hokkaido); }
#map.m-explore .pref[data-r="tohoku"] .shape { fill: var(--r-tohoku); }
#map.m-explore .pref[data-r="kanto"] .shape { fill: var(--r-kanto); }
#map.m-explore .pref[data-r="chubu"] .shape { fill: var(--r-chubu); }
#map.m-explore .pref[data-r="kansai"] .shape { fill: var(--r-kansai); }
#map.m-explore .pref[data-r="chugoku"] .shape { fill: var(--r-chugoku); }
#map.m-explore .pref[data-r="shikoku"] .shape { fill: var(--r-shikoku); }
#map.m-explore .pref[data-r="kyushu"] .shape { fill: var(--r-kyushu); }
#map .pref.fade { opacity: .35; }
#map.m-explore .pref.sel .shape { fill: var(--shu); stroke: color-mix(in srgb, var(--shu) 55%, var(--ink)); stroke-width: 1.2px; }
/* places: indigo dots for landmarks (something to click), ◎ in ink for capitals; the open one turns vermilion, like any chosen thing.
   Sizes are in screen pixels: --u is one pixel in map units, set on every view change */
#map .places { pointer-events: none; }
#map.m-quiz .places { display: none; }
#map .place { pointer-events: auto; cursor: pointer; }
#map .place.sight { display: none; }
#map .place.sight.on, #map.deep .place.sight { display: inline; }
#map .place .hit { r: calc(var(--u) * 12); fill: transparent; }
#map .place .m { r: calc(var(--u) * 4.5); fill: var(--ai); stroke: var(--surface); stroke-width: 1.5px; vector-effect: non-scaling-stroke; transition: fill 150ms ease; }
#map .place.capital .m { r: calc(var(--u) * 5.5); fill: var(--surface); stroke: var(--ink); }
#map .place.capital .dot { r: calc(var(--u) * 2.2); fill: var(--ink); transition: fill 150ms ease; }
#map .place.open .m { fill: var(--shu); }
#map .place.capital.open .m { fill: var(--surface); stroke: var(--shu); stroke-width: 2px; }
#map .place.capital.open .dot { fill: var(--shu); }
@media (hover: hover) and (pointer: fine) {
  #map .place:hover .m { stroke-width: 2.5px; }
}
/* the chosen prefecture wears its flag: vermilion first, then the flag settles over it */
#map .flag-edge { fill: none; stroke: var(--ink); stroke-width: 1.5px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#map .flag.in { animation: flag-in 420ms var(--ease-out) 80ms both; }
@keyframes flag-in { from { opacity: 0; } }

#map .pref.dim { opacity: .28; pointer-events: none; }
#map .pref.st-found .shape { fill: var(--ok-fill); }
#map .pref.st-late .shape { fill: var(--late-fill); }
#map .pref.st-missed .shape { fill: url(#hatch-missed); }
#map.gaveup .pref.st-missed { opacity: .55; }   /* after giving up, what you did find stands out */
#map .hatch-bg { fill: var(--bad-fill); }
#map .hatch-line { stroke: var(--bad); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
#map .pref.target .shape { fill: var(--shu); stroke: color-mix(in srgb, var(--shu) 55%, var(--ink)); stroke-width: 1.2px; }
#map .pref.flash .shape { animation: flash .6s ease-out; }
@keyframes flash { 0%, 40% { fill: var(--bad); } 100% { fill: var(--land); } }

#map .ring { fill: none; stroke: var(--ink); stroke-width: 2.5px; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .ring.pulse { animation: ring 1.4s ease-in-out infinite; }
@keyframes ring { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .6; } }

#map .lab { display: none; fill: var(--ink); stroke: var(--halo); paint-order: stroke; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; font-family: var(--f-body); font-weight: 700; pointer-events: none; }
#map.names .lab, #map .lab.on { display: block; }
#map .lab.cull { visibility: hidden; }
#map .lab.pop { animation: pop .5s ease-out; }
@keyframes pop { 0% { fill: var(--ok); } 100% { fill: var(--ink); } }

/* tools live in their own strip so they never sit on the Okinawa inset */
.pick { min-width: 0; max-width: 240px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); font-size: 13px; }
.map-tools { grid-row: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.tool-group { display: inline-flex; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tool-group button { border: 0; background: none; padding: 5px 10px; cursor: pointer; font-size: 13px; line-height: 1.4; min-width: 34px; }
.tool-group button + button { border-left: 1px solid var(--rule); }
.tool-group button[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); font-weight: 700; }
.tool-label { align-self: center; padding: 0 4px 0 10px; font-size: 12px; color: var(--muted); }

/* region row: the second line of the tool strip; each chip zooms to its region and lists it in the callout */
.legend { flex-basis: 100%; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.legend button { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 7px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: border-color 150ms ease, background-color 150ms ease, transform 160ms var(--ease-out); }
.legend button[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); color: var(--ai); font-weight: 700; }
.swatch { flex: none; width: 12px; height: 12px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
.cull-hint { grid-row: 2; grid-column: 1; align-self: start; justify-self: start; position: relative; z-index: 3; margin: 10px; padding: 3px 9px; font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; pointer-events: none; }
#map { grid-column: 1; }
.scale { margin-left: auto; font-size: 11px; color: var(--muted); display: grid; justify-items: start; gap: 2px; padding-left: 2px; font-variant-numeric: tabular-nums; pointer-events: none; }
.scale-bar { height: 6px; border: 1.5px solid var(--ink); border-top: 0; }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--surface); padding: 4px 10px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.tip b { font-weight: 700; }
.tip span { opacity: .75; margin-left: 6px; }

/* ---------- shared panel bits ---------- */
h2 { font-family: var(--f-display); font-size: 24px; font-weight: 800; margin: 0; line-height: 1.25; text-wrap: balance; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; text-decoration: none; transition: border-color 150ms ease, transform 160ms var(--ease-out); }

.tabs { position: relative; display: flex; gap: 2px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }

/* one vermilion underline that slides to the chosen tab (clicks only; arrow keys move it instantly) */

.tabpanel { display: grid; gap: 14px; }
.tabpanel h2, .ages h2 { margin: 0; font-family: var(--f-body); font-weight: 700; font-size: 15px; line-height: 1.3; }
.context { margin: 0; font-size: 13px; color: var(--muted); }

.items { list-style: none; margin: 0; padding: 0; display: grid; }

.items li:first-child { padding-top: 0; }

/* ---------- quiz ---------- */
.choices-type { display: grid; gap: 8px; }

.status { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; }

.progress .track { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }

.feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }

.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.answers button { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; display: grid; gap: 0; line-height: 1.35; transition: border-color 150ms ease, background-color 150ms ease, transform 160ms var(--ease-out); }
.answers button .k { font-size: 11px; color: var(--muted); }
.answers button b { font-size: 17px; }

.answers button.right { border-color: var(--ok); background: var(--ok-fill); color: var(--ink); }
.answers button.wrong { border-color: var(--bad); background: var(--bad-fill); color: var(--ink); }
.answers button:disabled { cursor: default; }
.typein { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.typein input { padding: 10px 12px; border: 1.5px solid var(--edge); border-radius: 8px; background: var(--surface); font-size: 17px; min-width: 0; transition: border-color 150ms ease; }
.typein input:focus { border-color: var(--ai); outline: none; }
.regions-left { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; font-size: 13px; font-variant-numeric: tabular-nums; }
.regions-left div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--rule); padding: 2px 0; }
.regions-left .done { color: var(--ok); font-weight: 700; }
.result { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; }
.score { font-family: var(--f-display); font-weight: 800; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 24px; color: var(--muted); }
.hanko { width: 76px; height: 76px; border: 3px solid var(--shu); border-radius: 50%; color: var(--shu); display: grid; place-items: center; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; line-height: 1.05; transform: rotate(-8deg); animation: stamp 320ms var(--ease-out) 150ms backwards; }
/* a perfect score is rare, so the hanko gets a moment: it is pressed onto the page */
@keyframes stamp { from { opacity: 0; transform: rotate(-8deg) scale(1.35); } }
.misslist { display: flex; flex-wrap: wrap; gap: 6px; }
.missgroups { display: grid; gap: 10px; }
.missgroup { display: grid; gap: 6px; }
.missgroup > span { font-size: 13px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.misses summary { cursor: pointer; font-weight: 700; color: var(--ai); padding: 4px 0; }
.hanko-wrap { display: grid; justify-items: center; gap: 6px; }
.hanko-wrap span { font-size: 13px; color: var(--muted); }
.misslist button { border: 1px solid var(--rule); color: var(--ai); background: none; border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; transition: background-color 150ms ease, transform 160ms var(--ease-out); }

/* ---------- interaction feedback ---------- */
/* hover only where there is a real pointer, so taps don't leave sticky highlights */
@media (hover: hover) and (pointer: fine) {
  .btn:hover { border-color: var(--edge); }
  .legend button:hover:not([aria-pressed="true"]), .co-list button:hover { border-color: var(--edge); }
  .answers button:hover:not(:disabled) { border-color: var(--ai); }
  .qtype:hover:not(:has(input:checked)) { border-color: var(--edge); }
  .misslist button:hover { border-color: var(--ai); background: var(--ai-soft); }
  .forecast:hover { text-decoration: underline; }
}
/* everything pressable gives way slightly, so the page feels like it heard the press */
@media (prefers-reduced-motion: no-preference) {

  .modes:has(#mode-explore:active) .modes-ink span:first-child, .modes:has(#mode-quiz:active) .modes-ink span:last-child { transform: scale(0.97); }
}
/* segments sit inside a clipped group, so they darken on press instead of scaling; the press lands at once, the release fades */
.tool-group button, .seg button, .tabs button { transition: background-color 150ms ease; }
.tool-group button:active, .seg button:active, .tabs button:active { background: color-mix(in srgb, var(--ai-soft) 65%, var(--rule)); transition-duration: 0ms; }
.legend-q { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.legend-q i.missed { /* taste-skill-ignore: the map's miss hatch drawn small, not a decorative gradient */ background: repeating-linear-gradient(45deg, var(--bad) 0 1.5px, var(--bad-fill) 1.5px 4px) !important; }
/* the record: a ruled ledger, figures right-aligned; the chosen game's column and scope's row are picked out in indigo */
.record { position: relative; padding-top: 14px; border-top: 1px solid var(--rule); }   /* positioned, so its sr-only header stays inside the scrolling panel */
.record summary { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; cursor: pointer; font-weight: 700; list-style: none; }
.record summary::-webkit-details-marker { display: none; }
.record summary > span:first-child::after { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 0 3px 9px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); transition: transform 160ms var(--ease-out); }
.record:not([open]) summary > span:first-child::after { transform: rotate(-45deg); }
.record table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 13px; }
.record th, .record td { padding: 0; border-bottom: 1px solid var(--rule); font-weight: 400; }
.record tbody tr:last-child > * { border-bottom: 0; }
.record table { table-layout: fixed; }
.record thead th { padding: 0 8px 6px; font-size: 12px; line-height: 1.3; color: var(--muted); text-align: left; vertical-align: bottom; }
.record thead th.num { width: 4.6em; text-align: right; }
.record thead th.on { color: var(--ai); font-weight: 700; }
.record .num { text-align: right; font-variant-numeric: tabular-nums; }
.record button { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 32px; padding: 4px 8px; border: 0; background: none; cursor: pointer; text-align: left; line-height: 1.3; transition: background-color 150ms ease; }
.record td button { justify-content: flex-end; font-weight: 700; white-space: nowrap; }
.record th button { flex-wrap: wrap; column-gap: 6px; row-gap: 0; }
.record th button .swatch { margin-right: -2px; }
.record th button span[lang] { color: var(--muted); }
.record tr.cur th button { color: var(--ai); font-weight: 700; }
.record tr.cur td.on button { background: var(--ai-soft); color: var(--ai); }
.record .none { color: var(--muted); font-weight: 400; }
.record .zen { display: inline-grid; place-items: center; width: 17px; height: 17px; border: 1.5px solid var(--shu); border-radius: 50%; color: var(--shu); font-family: var(--f-display); font-size: 10px; font-weight: 800; line-height: 1; transform: rotate(-8deg); }
.record button:active { background: color-mix(in srgb, var(--ai-soft) 65%, var(--rule)); transition-duration: 0ms; }
@media (hover: hover) and (pointer: fine) { .record button:hover { background: var(--ai-soft); } }
.legend-q i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--edge); }

/* ---------- small screens ---------- */
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .layout { grid-template-columns: minmax(0, 1fr); }

  .layout.quiz-live .mapwrap { position: sticky; top: 0; z-index: 5; }   /* during play the map stays on screen above the answers */

  .panel { overflow: visible; }

  .pick { flex: 1 1 100%; min-width: 0; max-width: none; order: 0; }   /* the list on its own row, names and zoom under it, then the regions */
  #names-group { order: 1; flex: none; }
  .map-tools > .tool-group[aria-label="Zoom"] { order: 1; flex: none; }
  .legend { order: 2; flex: 1 1 100%; }   /* the regions get their own row, so more than one chip shows */
  .scale { display: none; }
  .tool-label { padding-left: 8px; }
  .layout.explore .panel { position: fixed; top: auto; left: 0; right: 0; width: auto; max-height: 85vh; overflow: auto; overscroll-behavior: contain; border-radius: 16px 16px 0 0; transform: translateY(calc(100% + 24px));
    transition: transform 240ms var(--ease-drawer), visibility 0s 240ms; }
  .layout.explore.drawer-open .panel { transform: none; transition: transform 360ms var(--ease-drawer); }
  .layout.explore .scrim { display: block; position: fixed; inset: 0; z-index: 5; background: rgb(15 23 42 / .32); opacity: 0; pointer-events: none; transition: opacity 240ms ease; }
  .layout.explore.drawer-open .scrim { opacity: 1; pointer-events: auto; transition-duration: 360ms; }
  .drawer-bar::before { content: ""; position: absolute; left: 50%; top: 8px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--rule); }   /* grabber: the sheet can be swiped down */

}
.scrim { display: none; }
@media (max-width: 420px) {

@media (pointer: coarse) {

}

}
@keyframes fade { from { opacity: 0; } }

<script>
const PLACES = [{"id":"01-c","pref":"01","kind":"capital","xy":[649.1,191.3],"wiki":"Sapporo","pop":1959313,"popYear":2020,"note":"Laid out on a grid from 1869 as the base for settling Hokkaidō; home of the Snow Festival and Sapporo beer.","summary":"Sapporo is a designated city in Hokkaido, Japan. Located in the southwest of Hokkaido, it lies within the alluvial fan of the Toyohira River, a tributary of the Ishikari River. Sapporo is the capital of Hokkaido Prefecture and Ishikari Subprefecture."},{"id":"01-0","pref":"01","kind":"sight","i":0,"xy":[648.9,191.4],"ja":"さっぽろ雪まつり","wiki":"Sapporo Snow Festival","summary":"The Sapporo Snow Festival is a festival held annually in Sapporo, Japan, over seven days in February. Odori Park, Susukino, and Tsudome are the main sites of the festival."},{"id":"01-1","pref":"01","kind":"sight","i":1,"xy":[809,116.6],"ja":"知床国立公園","wiki":"Shiretoko National Park","summary":"Shiretoko National Park covers most of the Shiretoko Peninsula at the northeastern tip of the island of Hokkaido, Japan. The word \"Shiretoko\" is derived from an Ainu word \"sir etok\", meaning \"the place where the earth protrudes\"."},{"id":"01-2","pref":"01","kind":"sight","i":2,"xy":[625.9,269.6],"ja":"函館市","wiki":"Hakodate","summary":"Hakodate is a city and port located in Oshima Subprefecture, Hokkaido, Japan. It is the capital city of Oshima Subprefecture. The city is the third largest in Hokkaido after Sapporo and Asahikawa."},{"id":"01-3","pref":"01","kind":"sight","i":3,"xy":[633.4,183.9],"ja":"小樽運河","wiki":"Otaru","wikiBroader":true},{"id":"01-4","pref":"01","kind":"sight","i":4,"xy":[692.6,171.3],"ja":"富良野・美瑛","wiki":"Furano, Hokkaido","summary":"Furano is a city in the prefecture of Hokkaido, Japan, located in the southern reaches of Kamikawa Subprefecture, under whose jurisdiction it resides."},{"id":"01-5","pref":"01","kind":"sight","i":5,"xy":[651.4,221],"ja":"国立アイヌ民族博物館","wiki":"National Ainu Museum","summary":"The National Ainu Museum is a museum located in Shiraoi, Hokkaidō, Japan. It is situated within the grounds of Upopoy, a park complex that serves as a \"symbolic space for ethnic harmony\"."},{"id":"02-c","pref":"02","kind":"capital","xy":[629.6,325.7],"wiki":"Aomori","pop":425962,"popYear":2021,"note":"Ferry port at the head of Mutsu Bay, known for the Nebuta festival and its scallops and apples.","summary":"Aomori, officially Aomori City, is the capital city of Aomori Prefecture, in the Tōhoku region of Japan. Aomori is one of Japan's 62 core cities and the core of the Aomori metropolitan area."},{"id":"02-0","pref":"02","kind":"sight","i":0,"xy":[617.6,339.1],"ja":"弘前城","wiki":"Hirosaki Castle","summary":"Hirosaki Castle is a hirayama-style Japanese castle constructed in 1611. It was the seat of the Tsugaru clan, a 47,000 koku tozama daimyō clan which ruled over Hirosaki Domain, Mutsu Province, in what is now central Hirosaki, Aomori Prefecture, Japan. It was also referred to as Takaoka Castle."},{"id":"02-1","pref":"02","kind":"sight","i":1,"xy":[629.6,325.7],"ja":"青森ねぶた","wiki":"Aomori Nebuta Matsuri","summary":"The Aomori Nebuta Matsuri is a Japanese summer festival that takes place in Aomori, Aomori Prefecture, Japan in early August. The festival attracts the most tourists of any of the country's nebuta festivals, and is counted among the three largest festivals in the Tōhoku region."},{"id":"02-2","pref":"02","kind":"sight","i":2,"xy":[640,342.2],"ja":"奥入瀬渓流・十和田湖","wiki":"Oirase River","summary":"The Oirase River is a river located in eastern Aomori Prefecture, in the Tōhoku region of northern Japan."},{"id":"02-3","pref":"02","kind":"sight","i":3,"xy":[627.4,326.5],"ja":"三内丸山遺跡","wiki":"Sannai-Maruyama Site","summary":"The Sannai-Maruyama Site is an archaeological site and museum located in the Maruyama and Yasuda neighborhoods to the southwest of central Aomori City in Aomori Prefecture in northern Japan, containing the ruins of a very large Jōmon period settlement."},{"id":"02-4","pref":"02","kind":"sight","i":4,"xy":[602.9,347.9],"ja":"白神山地","wiki":"Shirakami-Sanchi","summary":"The Shirakami Mountains (White God Mountains) are a UNESCO World Heritage Site wilderness area in the Tōhoku region of northern Honshū, Japan. This mountainous area includes the last virgin forest of Japanese beech which once covered most of northern Japan. The area straddles both Akita and Aomori Prefectures, with three-fourths of it in Aomori Prefecture."},{"id":"02-5","pref":"02","kind":"sight","i":5,"xy":[643.3,295],"ja":"恐山","wiki":"Mount Osore","summary":"Mount Osore is the name of a Buddhist temple and folk religion pilgrimage destination in the center of remote Shimokita Peninsula of Aomori Prefecture, in the northern Tōhoku region of northern Japan. The temple is located in the caldera of an active volcano and is believed in Japanese mythology to be one of the gates to the underworld."},{"id":"03-c","pref":"03","kind":"capital","xy":[651.6,391.1],"wiki":"Morioka","pop":290553,"popYear":2021,"note":"Castle town ringed by mountains, famous for wanko soba and Nanbu ironware.","summary":"Morioka is the capital city of Iwate Prefecture located in the Tōhoku region of northern Japan."},{"id":"03-0","pref":"03","kind":"sight","i":0,"xy":[651.5,433],"ja":"中尊寺金色堂","wiki":"Chūson-ji","summary":"Chūson-ji is a Buddhist temple in the town of Hiraizumi in southern Iwate Prefecture, Japan. It is the head temple of the Tendai sect in Tōhoku region of northern Honshu. The temple claims it was founded in 850 by Ennin, the third chief abbot of the sect."},{"id":"03-1","pref":"03","kind":"sight","i":1,"xy":[651.9,433.6],"ja":"毛越寺","wiki":"Mōtsū-ji","summary":"Mōtsū-ji is a Buddhist temple of the Tendai sect in the town of Hiraizumi in southern Iwate Prefecture, Japan, and also refers to the historic area surrounding it containing the ruins of two older temples, Enryū-ji and Kashō-ji in a Jōdo (Pure Land) garden."},{"id":"03-2","pref":"03","kind":"sight","i":2,"xy":[658.5,433.1],"ja":"猊鼻渓","wiki":"Geibikei","summary":"Geibikei is a ravine on the Satetsu River in the city of Ichinoseki, Iwate Prefecture, Japan. It has been designated a National Place of Scenic Beauty and Natural Monument since 1923. In 1927 it was also selected as one of the 100 Landscapes of Japan."},{"id":"03-3","pref":"03","kind":"sight","i":3,"xy":[670.3,412.3],"ja":"遠野市","wiki":"Tōno, Iwate","summary":"Tōno is a city in Iwate Prefecture, Japan. Tōno is known as \"The City of Folklore\" for its rural nature, its preservation of traditional culture and especially for the collection of folktales, Tōno Monogatari, written by Kunio Yanagita in 1910."},{"id":"03-4","pref":"03","kind":"sight","i":4,"xy":[689.5,391.9],"ja":"浄土ヶ浜","wiki":"Jōdogahama","summary":"Jōdogahama is a series of rock formations along the coast of Miyako Bay in the city of Miyako, Iwate Prefecture, in the Tōhoku region of northern Japan. The area is part of the Sanriku Fukkō National Park, and is a nationally designated Place of Scenic Beauty."},{"id":"03-5","pref":"03","kind":"sight","i":5,"xy":[680.4,379.8],"ja":"龍泉洞","wiki":"Ryūsendō","summary":"Ryusendo Cave is one of Japan's three largest limestone caverns. It is located in the town of Iwaizumi, Iwate Prefecture, in the Tōhoku region of northern Japan."},{"id":"04-c","pref":"04","kind":"capital","xy":[643.1,476.8],"wiki":"Sendai","pop":1061177,"popYear":2020,"note":"The \"City of Trees\", founded by the warlord Date Masamune and the largest city in Tōhoku.","summary":"Sendai is the capital city of Miyagi Prefecture and the largest city in the Tōhoku region."},{"id":"04-0","pref":"04","kind":"sight","i":0,"xy":[651.9,470.3],"ja":"松島","wiki":"Matsushima","summary":"Matsushima is a group of islands in Miyagi Prefecture, Japan. There are some 260 tiny islands (shima) covered in pines (matsu) – hence the name – and it is considered to be one of the Three Views of Japan."},{"id":"04-1","pref":"04","kind":"sight","i":1,"xy":[643,477.9],"ja":"瑞鳳殿","wiki":"Zuihōden","summary":"Zuihōden in Sendai, Miyagi Prefecture, Japan is the mausoleum complex of Date Masamune and his heirs, daimyō of the Sendai Domain."},{"id":"04-2","pref":"04","kind":"sight","i":2,"xy":[642.6,477.8],"ja":"仙台城","wiki":"Aoba Castle","summary":"Aoba Castle is a Japanese castle located in Sendai, Miyagi Prefecture. Throughout the Edo period, Aoba Castle was home to the Date clan, daimyō of Sendai Domain. The castle was also known as Sendai-jō or as Gojō-rō."},{"id":"04-3","pref":"04","kind":"sight","i":3,"xy":[643.1,476.8],"ja":"仙台七夕まつり","wiki":"Sendai","wikiBroader":true},{"id":"04-4","pref":"04","kind":"sight","i":4,"xy":[628,491.1],"ja":"宮城蔵王キツネ村","wiki":"Miyagi Zao Fox Village","summary":"Miyagi Zao Fox Village, also known as Kitsune Mura, is a tourist attraction and sanctuary for foxes in Shiroishi, Miyagi, Japan where visitors can feed and interact with foxes."},{"id":"04-5","pref":"04","kind":"sight","i":5,"xy":[632.9,449.2],"ja":"鳴子峡","wiki":"Naruko, Miyagi","summary":"Naruko was a town located in Tamatsukuri District, Miyagi Prefecture, Japan."},{"id":"05-c","pref":"05","kind":"capital","xy":[603.6,392.5],"wiki":"Akita (city)","pop":302984,"popYear":2021,"note":"Former castle town of the Satake clan, host of the Kantō lantern-pole festival.","summary":"Akita is the capital and most populous city of Akita Prefecture, Japan, and has been designated a core city since 1 April 1997."},{"id":"05-0","pref":"05","kind":"sight","i":0,"xy":[624.9,398.7],"ja":"角館町","wiki":"Kakunodate, Akita","summary":"Kakunodate was a town located in Senboku District, Akita Prefecture, Japan."},{"id":"05-1","pref":"05","kind":"sight","i":1,"xy":[629.1,391],"ja":"田沢湖","wiki":"Lake Tazawa","summary":"Lake Tazawa is a caldera lake in the city of Semboku, Akita Prefecture, northern Japan. It is the deepest lake in Japan at 423 metres (1,388 ft). The area is a popular vacation area and several hot spring resorts can be found in the hills above the lake."},{"id":"05-2","pref":"05","kind":"sight","i":2,"xy":[634.7,386],"ja":"乳頭温泉郷","wiki":"Nyūtō Onsen","summary":"Nyūtō Onsen is a rural hot spring resort in Towada-Hachimantai National Park, Semboku City, Akita Prefecture, Japan and consists of Japanese-style hot spring spas scattered around the base of Mount Nyūtō."},{"id":"05-3","pref":"05","kind":"sight","i":3,"xy":[588.8,380],"ja":"男鹿半島","wiki":"Oga Peninsula","summary":"The Oga Peninsula is a rugged peninsula which projects west into the Sea of Japan from the coast of Akita in northern Honshū, the main island of Japan. Politically it coincides with the city of Oga."},{"id":"05-4","pref":"05","kind":"sight","i":4,"xy":[604.1,392.6],"ja":"秋田竿燈まつり","wiki":"Akita Kantō","summary":"The Akita Kantō is a Japanese festival celebrated from 3–7 August in Akita City, Akita Prefecture in hope for a good harvest."},{"id":"05-5","pref":"05","kind":"sight","i":5,"xy":[629,390.7],"ja":"田沢湖抱返り県立自然公園","wiki":"Tazawako Dakigaeri Prefectural Natural Park","summary":"Tazawako Dakigaeri Prefectural Natural Park is a Prefectural Natural Park in Akita Prefecture, Japan. Established in 1960, the park lies within the municipality of Semboku, and takes its name from Lake Tazawa and Dakigaeri Gorge."},{"id":"06-c","pref":"06","kind":"capital","xy":[618.5,478.8],"wiki":"Yamagata (city)","pop":247234,"popYear":2021,"note":"Basin city under the Zaō mountains, centre of Japan's cherry and imoni stew country.","summary":"Yamagata is the capital city of Yamagata Prefecture located in the Tōhoku region of northern Japan."},{"id":"06-0","pref":"06","kind":"sight","i":0,"xy":[622.9,475.2],"ja":"山寺（立石寺）","wiki":"Yama-dera","summary":"You may also be looking for the voice actor Kōichi Yamadera."},{"id":"06-1","pref":"06","kind":"sight","i":1,"xy":[621.5,483.8],"ja":"蔵王温泉","wiki":"Zaō Onsen","summary":"Zaō Onsen is a famous hot spring area on Mount Zaō in the northern part of Honshū, the main island of Japan."},{"id":"06-2","pref":"06","kind":"sight","i":2,"xy":[623.5,459.8],"ja":"銀山温泉","wiki":"Ginzan Onsen","summary":"Ginzan Onsen is an onsen (hot spring) area in Obanazawa, Yamagata Prefecture, Japan. Its name means \"silver mine hot spring\". Ginzan Onsen's economy grew due to silver mining and production and eventually transitioned to tourism when it opened dozens of hot spring resorts and ryokan along the central river that runs through the town."},{"id":"06-3","pref":"06","kind":"sight","i":3,"xy":[601.6,453.2],"ja":"出羽三山","wiki":"Three Mountains of Dewa","summary":"The Three Mountains of Dewa refer to the three sacred mountains of Mount Haguro, Mount Gassan and Mount Yudono, which are clustered together in the ancient province of Dewa (modern-day Yamagata Prefecture)."},{"id":"06-4","pref":"06","kind":"sight","i":4,"xy":[608,450.8],"ja":"最上川舟下り","wiki":"Mogami River","summary":"The Mogami River is a Class A river in Yamagata Prefecture, Japan."},{"id":"06-5","pref":"06","kind":"sight","i":5,"xy":[609,499],"ja":"米沢市","wiki":"Yonezawa, Yamagata","summary":"Yonezawa is a city in Yamagata Prefecture, Japan. Yonezawa is most famous for its local delicacies (apples, Yonezawa beef, and carp) and for being a castle town that was once home to the Uesugi clan, including the daimyō Uesugi Yozan."},{"id":"07-c","pref":"07","kind":"capital","xy":[626.2,507.8],"wiki":"Fukushima (city)","pop":284282,"popYear":2021,"note":"Basin city famous for its peaches and the blossoms of Hanamiyama.","summary":"Fukushima is the capital city of Fukushima Prefecture, Japan. It is located in the northern part of the Nakadōri or central region of the prefecture."},{"id":"07-0","pref":"07","kind":"sight","i":0,"xy":[601.4,525.2],"ja":"鶴ヶ城","wiki":"Aizuwakamatsu Castle","summary":"Tsuruga Castle, also known as Aizuwakamatsu Castle is a Japanese castle in northern Japan, at the center of the city of Aizuwakamatsu, in Fukushima Prefecture."},{"id":"07-1","pref":"07","kind":"sight","i":1,"xy":[598.5,534.5],"ja":"大内宿","wiki":"Ōuchi-juku","summary":"Ōuchi-juku was a small post station in Japan's Edo period and part of the Aizu Nishi Kaidō. It is now located in the town of Shimogō in Minamiaizu District, Fukushima Prefecture, and is famous for the numerous traditional thatched buildings from the Edo Period that line its main street."},{"id":"07-2","pref":"07","kind":"sight","i":2,"xy":[608.3,515.1],"ja":"五色沼","wiki":"Goshiki-numa","summary":"Goshiki-numa, is a cluster of five volcanic lakes situated at the foot of Mount Bandai in the center of the lake district of the Bandai Highland, Kitashiobara, Fukushima, Japan."},{"id":"07-3","pref":"07","kind":"sight","i":3,"xy":[602.1,524.3],"ja":"さざえ堂","wiki":"Aizuwakamatsu","wikiBroader":true},{"id":"07-4","pref":"07","kind":"sight","i":4,"xy":[627.2,508],"ja":"花見山公園","wiki":"Fukushima (city)","wikiBroader":true},{"id":"07-5","pref":"07","kind":"sight","i":5,"xy":[609.1,525.6],"ja":"猪苗代湖","wiki":"Lake Inawashiro","summary":"Lake Inawashiro is the fourth-largest lake in Japan, located in central Fukushima Prefecture, south of Mount Bandai. It is also known as the 'Heavenly Mirror Lake'. The lake is located within the borders of Bandai-Asahi National Park."},{"id":"08-c","pref":"08","kind":"capital","xy":[630.1,590.6],"wiki":"Mito, Ibaraki","pop":270445,"popYear":2021,"note":"Home of Kairakuen, one of Japan's three great landscape gardens, and of nattō.","summary":"Mito is the capital city of Ibaraki Prefecture, in the northern Kantō region of Japan. The percentage of the population aged over 65 was 27.1%."},{"id":"08-0","pref":"08","kind":"sight","i":0,"xy":[629.4,590.2],"ja":"偕楽園","wiki":"Kairaku-en","summary":"Kairaku-en is a Japanese garden located in Mito, Ibaraki Prefecture, Japan. Along with Kenroku-en and Koraku-en, it is considered one of the Three Great Gardens of Japan."},{"id":"08-1","pref":"08","kind":"sight","i":1,"xy":[635.7,588.2],"ja":"国営ひたち海浜公園","wiki":"Hitachi Seaside Park","summary":"Hitachi Seaside Park is a public park in Hitachinaka, Ibaraki, Japan."},{"id":"08-2","pref":"08","kind":"sight","i":2,"xy":[626,567],"ja":"袋田の滝","wiki":"Fukuroda Falls","summary":"Fukuroda Falls is a waterfall located in the town of Daigo, Ibaraki Prefecture Japan. It is a nationally designated Place of Scenic Beauty. and is one of \"Japan’s Top 100 Waterfalls\", per a listing published by the Japanese Ministry of the Environment in 1990."},{"id":"08-3","pref":"08","kind":"sight","i":3,"xy":[619.2,613.9],"ja":"牛久大仏","wiki":"Ushiku Daibutsu","summary":"Ushiku Daibutsu is a statue located in Ushiku, Ibaraki Prefecture, Japan. Completed in 1993, it stands a total of 120 metres (390 ft) tall, including the 10 m (33 ft) base and 10 m lotus platform. It held the record for the tallest statue from 1993 to 2008 and as of 2023, it is the fifth-tallest statue in the world."},{"id":"08-4","pref":"08","kind":"sight","i":4,"xy":[613.1,599.7],"ja":"筑波山","wiki":"Mount Tsukuba","summary":"Mount Tsukuba is an 877 m (2,877 ft) mountain located at the northern-end of Tsukuba, Japan. It is one of the most famous mountains in Japan, particularly well known for its double peaks, Nyotai-san 877 m (2,877 ft) and Nantai-san 871 m (2,858 ft)."},{"id":"08-5","pref":"08","kind":"sight","i":5,"xy":[638.9,613.7],"ja":"鹿島神宮","wiki":"Kashima Shrine","summary":"Kashima Shrine is a Shinto shrine located in Kashima, Ibaraki in the northern Kantō region of Japan. It is dedicated to Takemikazuchi-no-Ōkami, one of the patron deities of martial arts. Various dōjō of kenjutsu and kendō often display a hanging scroll emblazoned with the name \"Takemikazuchi-no-Ōkami\"."},{"id":"09-c","pref":"09","kind":"capital","xy":[601.5,580.6],"wiki":"Utsunomiya","pop":518197,"popYear":2021,"note":"Gateway to Nikkō and known across Japan as the gyōza capital.","summary":"Utsunomiya is the capital and largest city of Tochigi Prefecture in the northern Kantō region of Japan. Utsunomiya is famous for its gyoza (pan fried dumplings). There are more than two hundred gyoza restaurants in Utsunomiya."},{"id":"09-0","pref":"09","kind":"sight","i":0,"xy":[587.5,569.1],"ja":"日光東照宮","wiki":"Nikkō Tōshō-gū","summary":"Nikkō Tōshō-gū is a Tōshō-gū Shinto shrine located in Nikkō, Tochigi Prefecture, Japan."},{"id":"09-1","pref":"09","kind":"sight","i":1,"xy":[583,570.5],"ja":"華厳滝・中禅寺湖","wiki":"Kegon Falls","summary":"Kegon Falls is located at Lake Chūzenji (source of the Oshiri River) in Nikkō National Park near the city of Nikkō, Tochigi Prefecture, Japan. The falls were formed when the Daiya River was rerouted by lava flows."},{"id":"09-2","pref":"09","kind":"sight","i":2,"xy":[584.8,595.6],"ja":"あしかがフラワーパーク","wiki":"Ashikaga, Tochigi","wikiBroader":true},{"id":"09-3","pref":"09","kind":"sight","i":3,"xy":[581.5,594.3],"ja":"足利学校","wiki":"Ashikaga Gakkō","summary":"Ashikaga Gakkō is Japan's oldest standing academic building. It is located in the city of Ashikaga, Tochigi Prefecture, about 70 kilometres north of Tokyo. It was designated a National Historic Site of Japan in 1928."},{"id":"09-4","pref":"09","kind":"sight","i":4,"xy":[611.8,585.4],"ja":"益子町","wiki":"Mashiko, Tochigi","summary":"Mashiko is a town located in Tochigi Prefecture, Japan. Mashiko is known for its pottery, called Mashiko ware."},{"id":"09-5","pref":"09","kind":"sight","i":5,"xy":[605.3,549.8],"ja":"那須高原","wiki":"Nasu, Tochigi","summary":"Nasu is a town located in Tochigi Prefecture, Japan."},{"id":"10-c","pref":"10","kind":"capital","xy":[562.8,591.9],"wiki":"Maebashi","pop":331849,"popYear":2021,"note":"Prefectural seat on the Tone River; neighbouring Takasaki is the larger city.","summary":"Maebashi is the capital city of Gunma Prefecture, in the northern Kantō region of Japan. It was the most populous city within Gunma Prefecture until Takasaki merged with nearby towns between 2006 and 2009."},{"id":"10-0","pref":"10","kind":"sight","i":0,"xy":[539.9,577.8],"ja":"草津温泉","wiki":"Kusatsu Onsen","summary":"Kusatsu Onsen is a hot spring resort located in Gunma Prefecture, Japan, northwest of Tokyo. It is a popular tourist destination."},{"id":"10-1","pref":"10","kind":"sight","i":1,"xy":[555.7,585.8],"ja":"伊香保温泉","wiki":"Shibukawa, Gunma","wikiBroader":true},{"id":"10-2","pref":"10","kind":"sight","i":2,"xy":[554.7,600.2],"ja":"富岡製糸場","wiki":"Tomioka Silk Mill","summary":"Tomioka Silk Mill is Japan's oldest modern model silk reeling factory, established in 1872 by the government to introduce modern machine silk reeling from France and spread its technology in Japan. The factory is designated by the government as a National Historic Site and all its buildings are preserved in very good condition."},{"id":"10-3","pref":"10","kind":"sight","i":3,"xy":[573.7,559.6],"ja":"尾瀬国立公園","wiki":"Oze National Park","summary":"Oze National Park, is an area consisting of open greenland in Fukushima, Tochigi, Gunma and Niigata Prefectures in Japan."},{"id":"10-4","pref":"10","kind":"sight","i":4,"xy":[557.8,595.6],"ja":"達磨寺","wiki":"Shorinzan Daruma Temple","summary":"Shorinzan Daruma Temple is a small temple located in Takasaki, Gunma Prefecture. It was built in 1697 by the Obaku school of Zen Buddhism. Takasaki is known as the birthplace of daruma, as it is believed that the dolls originated from the region many years ago."},{"id":"10-5","pref":"10","kind":"sight","i":5,"xy":[559.2,574.9],"ja":"みなかみ町","wiki":"Minakami, Gunma","summary":"Minakami is a town located in Gunma Prefecture, Japan. Much of the town is within the borders of Jōshin'etsu-kōgen National Park."},{"id":"11-c","pref":"11","kind":"capital","xy":[591.9,622.2],"wiki":"Saitama (city)","pop":1325843,"popYear":2021,"note":"Formed in 2001 by merging Urawa, Ōmiya and Yono; a major rail hub north of Tōkyō.","summary":"Saitama is the capital and largest city of Saitama Prefecture, Japan. Its area incorporates the former cities of Urawa, Ōmiya, Yono and Iwatsuki. It is a city designated by government ordinance."},{"id":"11-0","pref":"11","kind":"sight","i":0,"xy":[584,618.8],"ja":"川越市","wiki":"Kawagoe, Saitama","summary":"Kawagoe is a city in Saitama Prefecture, Japan. The city is known locally as \"Little Edo\" after the old name for Tokyo, due to its many historic buildings."},{"id":"11-1","pref":"11","kind":"sight","i":1,"xy":[564.6,615.5],"ja":"秩父市","wiki":"Chichibu, Saitama","summary":"Chichibu is a city located in Saitama Prefecture, Japan."},{"id":"11-2","pref":"11","kind":"sight","i":2,"xy":[565.6,608.1],"ja":"長瀞町","wiki":"Nagatoro, Saitama","summary":"Nagatoro is a town located in Saitama Prefecture, Japan. The Nagatoro River is well known for its rapids and whitewater rafting and boating, and the entire town is designated as a prefectural nature park and preserve."},{"id":"11-3","pref":"11","kind":"sight","i":3,"xy":[590.4,618.8],"ja":"鉄道博物館","wiki":"Railway Museum (Saitama)","summary":"The Railway Museum is a railway museum in Saitama, Saitama, Japan, which opened on 14 October 2007. It was built and is operated by the East Japan Railway Culture Foundation, a non-profit subsidiary of the East Japan Railway Company (JR East). It consists of a 19,800 m2 building on a site covering 42,500 m2, with a display area 9,500 m2 in size."},{"id":"11-4","pref":"11","kind":"sight","i":4,"xy":[583.1,606.8],"ja":"さきたま古墳公園","wiki":"Sakitama Kofun Cluster","summary":"The Saikitama Kofun Cluster is a group of burial mounds located in the city of Gyōda, Saitama Prefecture, in the Kantō region of Japan. The site was designated a National Historic Site in 1938, and was upgraded in status to a Special National Historic Site of Japan in 2020."},{"id":"11-5","pref":"11","kind":"sight","i":5,"xy":[599.5,613.8],"ja":"首都圏外郭放水路","wiki":"Metropolitan Area Outer Underground Discharge Channel","summary":"The Metropolitan Area Outer Underground Discharge Channel, popularly known as G-Cans, is an underground water infrastructure project in Japan. It is the world's largest underground flood water diversion facility, built to mitigate overflowing of the city's major waterways and rivers during rain and typhoon seasons."},{"id":"12-c","pref":"12","kind":"capital","xy":[614.7,636.4],"wiki":"Chiba (city)","pop":975014,"popYear":2021,"note":"Port city on Tokyo Bay with the world's longest suspended monorail.","summary":"Chiba is the capital city of Chiba Prefecture, Japan. It sits about 40 kilometres (25 mi) east of the centre of Tokyo on Tokyo Bay. The city became a government-designated city in 1992."},{"id":"12-0","pref":"12","kind":"sight","i":0,"xy":[624.4,625.3],"ja":"成田山新勝寺","wiki":"Narita-san","summary":"Narita-san Shinshō-ji is a Shingon Buddhist temple located in central Narita, Chiba, Japan. It was founded in 940 by Kanchō Daisōjō, a disciple of Kōbō Daishi. It is a lead temple in the Chisan branch of New Shingon, includes a large complex of buildings and grounds, and is one of the best-known temples in the Kantō region."},{"id":"12-1","pref":"12","kind":"sight","i":1,"xy":[603.8,635.5],"ja":"東京ディズニーリゾート","wiki":"Tokyo Disney Resort","summary":"Tokyo Disney Resort (local nickname TDR) is a theme park and vacation resort located in Urayasu, Chiba, Japan, just east of Tokyo."},{"id":"12-2","pref":"12","kind":"sight","i":2,"xy":[603,663.5],"ja":"鋸山","wiki":"Mount Nokogiri (Chiba)","summary":"Mount Nokogiri literally \"saw mountain\" is a low mountain on the Bōsō Peninsula on Honshu, Japan. It lies on the southern border of the city of Futtsu and the town Kyonan in Awa District in Chiba Prefecture."},{"id":"12-3","pref":"12","kind":"sight","i":3,"xy":[632.9,619.1],"ja":"佐原市","wiki":"Sawara, Chiba","summary":"Sawara was a city located in Katori District, Chiba Prefecture, Japan."},{"id":"12-4","pref":"12","kind":"sight","i":4,"xy":[631.6,640.3],"ja":"九十九里浜","wiki":"Kujūkuri Beach","summary":"Kujūkuri Beach is a sandy beach that occupies much of the northeast coast of the Bōsō Peninsula in Chiba Prefecture, Japan. Kujūkuri Beach is a popular swimming and surfing destination for inhabitants of Greater Tokyo. The beach is protected as part of Kujūkuri Prefectural Natural Park."},{"id":"12-5","pref":"12","kind":"sight","i":5,"xy":[618.2,657],"ja":"千葉県立養老渓谷奥清澄自然公園","wiki":"Yōrō Keikoku Okukiyosumi Prefectural Natural Park","summary":"Yōrō Keikoku Okukiyosumi Prefectural Natural Park is a Prefectural Natural Park in southern Chiba Prefecture, Japan. First designated for protection in 1935, the park's central features are the Yōrō Valley and Kiyosumi Mountains. The park spans the municipalities of Ichihara, Kamogawa, Kimitsu, and Ōtaki."},{"id":"13-c","pref":"13","kind":"capital","xy":[595,632.1],"wiki":"Shinjuku","pop":346115,"popYear":2021,"note":"Tōkyō's government sits in Shinjuku; the metropolis has no separate capital city.","summary":"Shinjuku, officially called Shinjuku City, is one of the 23 special wards of Tokyo."},{"id":"13-0","pref":"13","kind":"sight","i":0,"xy":[599.5,630.7],"ja":"浅草寺","wiki":"Sensō-ji","summary":"Sensō-ji, is an ancient Buddhist temple in Asakusa, Tokyo, Japan. It is Tokyo's oldest-established temple, and one of its most significant. It is dedicated to Kannon, the bodhisattva of compassion."},{"id":"13-1","pref":"13","kind":"sight","i":1,"xy":[594.9,633.1],"ja":"明治神宮","wiki":"Meiji Shrine","summary":"Meiji Shrine is a Shinto shrine in Shibuya, Tokyo, that is dedicated to the deified spirits of Emperor Meiji and his wife, Empress Shōken. The shrine does not contain the emperor's grave, which is located at Fushimi-momoyama, south of Kyoto."},{"id":"13-2","pref":"13","kind":"sight","i":2,"xy":[597.4,632.7],"ja":"皇居東御苑","wiki":"Tokyo Imperial Palace","summary":"The Imperial Palace is the main residence of the emperor of Japan."},{"id":"13-3","pref":"13","kind":"sight","i":3,"xy":[600.2,630.9],"ja":"東京スカイツリー","wiki":"Tokyo Skytree","summary":"Tokyo Skytree, a.k.a Tokyo Sky Tree, is a broadcasting and observation tower, located in Sumida, Tokyo, Japan."},{"id":"13-4","pref":"13","kind":"sight","i":4,"xy":[595,634.1],"ja":"渋谷スクランブル交差点","wiki":"Shibuya Crossing","summary":"Shibuya Scramble Crossing, commonly known as Shibuya Crossing, is a scramble crossing in Shibuya, Tokyo, Japan. It is located near Shibuya Station in Shibuya, a major commercial and entertainment district in Tokyo. It has been described as the world's busiest pedestrian crossing, with 1,000–2,000 people crossing during a single green light cycle."},{"id":"14-c","pref":"14","kind":"capital","xy":[592.3,646.7],"wiki":"Yokohama","pop":3757630,"popYear":2020,"note":"Opened to foreign trade in 1859; Chinatown, Minato Mirai and Japan's second-largest city.","summary":"Yokohama is the second-largest city in Japan by population as well as by area, and the country's most populous municipality. The population was the same in 2026, but steadily decreased over 2025. It lies on Tokyo Bay, south of Tokyo, in the Kantō region of the main island of Honshu."},{"id":"14-0","pref":"14","kind":"sight","i":0,"xy":[587.8,654.8],"ja":"鎌倉大仏","wiki":"Kōtoku-in","summary":"Kōtoku-in is a Buddhist temple of the Jōdo-shū sect in the city of Kamakura in Kanagawa Prefecture, Japan. Its mountain name is Daii-zan, and its common temple name is Shōjōsen-ji."},{"id":"14-1","pref":"14","kind":"sight","i":1,"xy":[588.8,654.3],"ja":"鶴岡八幡宮","wiki":"Tsurugaoka Hachimangū","summary":"Tsurugaoka Hachimangū is the most important Shinto shrine in the city of Kamakura, Kanagawa Prefecture, Japan. The shrine is a cultural center of the city of Kamakura and serves as the venue of many of its most important festivals with two museums."},{"id":"14-2","pref":"14","kind":"sight","i":2,"xy":[563.3,663.2],"ja":"箱根町","wiki":"Hakone","summary":"Hakone is a town in Kanagawa Prefecture, Japan."},{"id":"14-3","pref":"14","kind":"sight","i":3,"xy":[592.9,647],"ja":"横浜中華街","wiki":"Yokohama Chinatown","summary":"Yokohama Chinatown is located in Yokohama, Japan, which is located just south of Tokyo. It was established in the late 19th century, and has a population of about 3,000 to 4,000."},{"id":"14-4","pref":"14","kind":"sight","i":4,"xy":[592.1,646.2],"ja":"横浜みなとみらい21","wiki":"Minato Mirai 21","summary":"Minato Mirai 21, often known as simply Minato Mirai and abbreviated as MM (used on the Minatomirai Line station numbering; e.g. \"MM 1\"), is the central business district of Yokohama, Japan."},{"id":"14-5","pref":"14","kind":"sight","i":5,"xy":[585.1,655.9],"ja":"江の島","wiki":"Enoshima","summary":"Enoshima is a small offshore island, about 4 km (2.5 mi) in circumference, at the mouth of the Katase River which flows into the Sagami Bay of Kanagawa Prefecture, Japan. Administratively, Enoshima is part of the mainland city of Fujisawa, and is linked to the Katase section of that city by a 389-metre-long (1,276 ft) bridge."},{"id":"15-c","pref":"15","kind":"capital","xy":[558.5,501.4],"wiki":"Niigata (city)","pop":790646,"popYear":2021,"note":"Port at the mouth of the Shinano, Japan's longest river, and a gateway to Sado Island.","summary":"Niigata is a city located in the northern part of Niigata Prefecture (Kaetsu area). It is the capital and the most populous city of Niigata Prefecture, and one of the cities designated by government ordinance of Japan, located in the Chūbu region of Japan."},{"id":"15-0","pref":"15","kind":"sight","i":0,"xy":[527.1,496.2],"ja":"佐渡島","wiki":"Sado Island","summary":"Sado Island is an island located in the eastern part of the Sea of Japan, under the jurisdiction of Sado City, Niigata Prefecture, Japan, with a coastline of 262.7 kilometres (163.2 mi). The shortest distance between Sado Island and Honshu is 32 km (20 mi). The highest peak on Sado Island is Mount Kinpoku, with an elevation of 1,172 m (3,845 ft)."},{"id":"15-1","pref":"15","kind":"sight","i":1,"xy":[549.7,559.9],"ja":"越後湯沢","wiki":"Yuzawa, Niigata","summary":"Yuzawa is a town located in Niigata Prefecture, Japan. The town is famous for its hot springs, ski resorts and Snow country."},{"id":"15-2","pref":"15","kind":"sight","i":2,"xy":[547.1,558.9],"ja":"清津峡","wiki":"Kiyotsu Gorge","summary":"Kiyotsu Gorge is a nationally designated Place of Scenic Beauty and Natural Monument on the border between Yuzawa and Tōkamachi, Niigata Prefecture, Japan."},{"id":"15-3","pref":"15","kind":"sight","i":3,"xy":[539.6,555.4],"ja":"大地の芸術祭 越後妻有アートトリエンナーレ","wiki":"Echigo-Tsumari Art Triennial","summary":"The Echigo-Tsumari Art Triennial (ETAT) is an international contemporary art festival held once every three years in Niigata Prefecture, Japan. The festival was created by the Tokyo commercial gallery Art Front Gallery (AFG) and is directed by gallery director Fram Kitagawa."},{"id":"15-4","pref":"15","kind":"sight","i":4,"xy":[549,514.1],"ja":"彌彦神社","wiki":"Yahiko Shrine","summary":"Yahiko jinja, also known as Iyahiko-jinja, is a Shinto shrine in the Yahiko neighborhood of the village of Yahiko, Nishikanbara District, Niigata Prefecture, Japan. It is one of the three shrines which claim the title of ichinomiya of former Echigo Province. The shrine's annual festival is held on February 2."},{"id":"15-5","pref":"15","kind":"sight","i":5,"xy":[578.6,482.4],"ja":"村上市","wiki":"Murakami, Niigata","summary":"Murakami is a city located in Niigata Prefecture, Japan."},{"id":"16-c","pref":"16","kind":"capital","xy":[478.3,584.3],"wiki":"Toyama (city)","pop":413028,"popYear":2021,"note":"Built on medicine peddling; the Tateyama range rises behind the city.","summary":"Toyama is the capital city of Toyama Prefecture, Japan, located on the coast of the Sea of Japan in the Chūbu region on central Honshū, about 200 km (120 mi) north of the city of Nagoya and 300 km (190 mi) northwest of Tokyo."},{"id":"16-0","pref":"16","kind":"sight","i":0,"xy":[489.4,583],"ja":"立山黒部アルペンルート","wiki":"Tateyama Kurobe Alpine Route","summary":"The Tateyama Kurobe Alpine Route is a mountain sightseeing route between Tateyama, Toyama and Ōmachi, Nagano, Japan. Opened on June 1, 1971, it is 37 kilometres (23 miles) long, with a difference in elevation of as much as 1,975 metres (6,480 feet)."},{"id":"16-1","pref":"16","kind":"sight","i":1,"xy":[495.6,583.1],"ja":"黒部ダム","wiki":"Kurobe Dam","summary":"The Kurobe Dam, or Kuroyon Dam, is a 186 m (610 ft) high variable-radius arch dam on the Kurobe River in Toyama Prefecture, Japan. The tallest dam in Japan, it supports the 335 MW Kurobe No. 4 Hydropower Plant and is owned by Kansai Electric Power Company. It was constructed between 1956 and 1963 at a cost of 51.3 billion yen."},{"id":"16-2","pref":"16","kind":"sight","i":2,"xy":[461.1,592],"ja":"五箇山","wiki":"Gokayama","summary":"Gokayama is an area within the city of Nanto in Toyama Prefecture, Japan. It has been inscribed on the UNESCO World Heritage List due to its traditional gasshō-zukuri houses, alongside nearby Shirakawa-gō in Gifu Prefecture."},{"id":"16-3","pref":"16","kind":"sight","i":3,"xy":[491.6,568.3],"ja":"黒部峡谷鉄道","wiki":"Kurobe Gorge Railway","summary":"The Kurobe Gorge Railway, or Kurotetsu for short, is a private, 762 mm (2 ft 6 in) narrow gauge railway company operating the Kurobe Gorge Main Line along the Kurobe River in the Kurobe gorge area of Toyama Prefecture, Japan."},{"id":"16-4","pref":"16","kind":"sight","i":4,"xy":[466.3,569.3],"ja":"雨晴海岸","wiki":"Takaoka, Toyama","wikiBroader":true},{"id":"16-5","pref":"16","kind":"sight","i":5,"xy":[474.1,576.1],"ja":"富山市ガラス美術館","wiki":"Toyama (city)","wikiBroader":true},{"id":"17-c","pref":"17","kind":"capital","xy":[447.7,584.1],"wiki":"Kanazawa","pop":462479,"popYear":2020,"note":"Former seat of the Maeda clan, with the Kenroku-en garden and gold-leaf crafts.","summary":"Kanazawa is the capital of Ishikawa Prefecture in central Japan."},{"id":"17-0","pref":"17","kind":"sight","i":0,"xy":[448,584],"ja":"兼六園","wiki":"Kenroku-en","summary":"Kenroku-en, located in Kanazawa, Ishikawa, Japan, is a strolling style garden constructed during the Edo period by the Maeda clan. Along with Kairaku-en and Kōraku-en, Kenroku-en is considered one of the Three Great Gardens of Japan and is noted for its beauty across all seasons, particularly in winter."},{"id":"17-1","pref":"17","kind":"sight","i":1,"xy":[448.1,583.3],"ja":"ひがし茶屋街"},{"id":"17-2","pref":"17","kind":"sight","i":2,"xy":[447.8,583.8],"ja":"金沢城公園","wiki":"Kanazawa Castle","summary":"Kanazawa Castle is a large, partially restored Japanese castle in Kanazawa, Ishikawa, Japan. It is located adjacent to the celebrated Kenroku-en Garden, which once formed the castle's private outer garden."},{"id":"17-3","pref":"17","kind":"sight","i":3,"xy":[447.8,584.1],"ja":"金沢21世紀美術館","wiki":"21st Century Museum of Contemporary Art, Kanazawa","summary":"The 21st Century Museum of Contemporary Art, Kanazawa is a museum of contemporary art located in Kanazawa, Ishikawa, Japan."},{"id":"17-4","pref":"17","kind":"sight","i":4,"xy":[463.5,532.7],"ja":"白米千枚田","wiki":"Wajima, Ishikawa","wikiBroader":true},{"id":"17-5","pref":"17","kind":"sight","i":5,"xy":[447.3,583.9],"ja":"長町武家屋敷跡","wiki":"Kanazawa","wikiBroader":true},{"id":"18-c","pref":"18","kind":"capital","xy":[426.9,613.7],"wiki":"Fukui (city)","pop":261474,"popYear":2021,"note":"Castle town rebuilt after war and the 1948 earthquake; gateway to the dinosaur museum and Eihei-ji.","summary":"Fukui is the capital city of Fukui Prefecture, Japan. Most of the population lives in a small central area; the city limits include rural plains, mountainous areas, and suburban sprawl along the Route 8 bypass."},{"id":"18-0","pref":"18","kind":"sight","i":0,"xy":[440.7,612.5],"ja":"福井県立恐竜博物館","wiki":"Fukui Prefectural Dinosaur Museum","summary":"The Fukui Prefectural Dinosaur Museum, located in Katsuyama, Fukui, Japan, is one of the leading dinosaur museums in Asia that is renowned for its exhibits of fossil specimens of dinosaurs and paleontological research."},{"id":"18-1","pref":"18","kind":"sight","i":1,"xy":[422.3,603.3],"ja":"東尋坊","wiki":"Tōjinbō","summary":"Tōjinbō is a series of cliffs on the Sea of Japan in Japan made from columnar joints of pyroxene andesite. It is located in the Antō part of Mikuni-chō in Sakai, Fukui Prefecture. The cliffs average 30 metres (98 ft) in height and stretch for 1 km (3,281 ft)."},{"id":"18-2","pref":"18","kind":"sight","i":2,"xy":[433.4,614.3],"ja":"永平寺","wiki":"Eihei-ji","summary":"Eihei-ji is one of two main temples of the Sōtō school of Zen Buddhism, the largest single religious denomination in Japan (by number of temples in a single legal entity). The other is Sōji-ji in Yokohama. Eihei-ji is located about 15 km (9 mi) east of Fukui in Fukui Prefecture, Japan."},{"id":"18-3","pref":"18","kind":"sight","i":3,"xy":[430.6,617.5],"ja":"一乗谷朝倉氏遺跡","wiki":"Ichijōdani Asakura Family Historic Ruins","summary":"The Ichijōdani Asakura Family Historic Ruins are historic ruins located in the Kidonouchi section of the city of Fukui, Fukui Prefecture, in the Hokuriku region of Japan. This area was controlled by the Asakura clan for 103 years during the Sengoku period."},{"id":"18-4","pref":"18","kind":"sight","i":4,"xy":[429.4,608.4],"ja":"丸岡城","wiki":"Maruoka Castle","summary":"Maruoka Castle is a hirayama-style Japanese castle located in the Maruoka neighbourhood of the city of Sakai, Fukui Prefecture, in the Hokuriku region of Japan. It also called Kasumi-ga-jō due to the legend that whenever an enemy approaches the castle, a thick mist appears and hides it."},{"id":"18-5","pref":"18","kind":"sight","i":5,"xy":[410.8,642.9],"ja":"三方五湖","wiki":"Mikata Five Lakes","summary":"Mikata Five Lakes, also called the Five Lakes of Mikata, are a series of brackish and freshwater lakes located in Mihama and Wakasa, Fukui, Japan, which are close to the coast of Wakasa Bay. They consist of Lakes Mikata, Suigetsu, Suga, Kugushi and Hiruga. These five lakes are all located in Wakasa Wan Quasi-National Park."},{"id":"19-c","pref":"19","kind":"capital","xy":[540.3,635.8],"wiki":"Kōfu","pop":187144,"popYear":2021,"note":"Former base of the warlord Takeda Shingen, with views of Mount Fuji; known for wine and jewellery crafts.","summary":"Kōfu is the capital city of Yamanashi Prefecture, Japan."},{"id":"19-0","pref":"19","kind":"sight","i":0,"xy":[555.4,650],"ja":"富士五湖","wiki":"Fuji Five Lakes","summary":"Fuji Five Lakes is the name of the area located at the base of Mount Fuji in the Yamanashi Prefecture of Japan. It has a population of about 100,000 and sits about 1,000 meters (3,300 ft) above sea level. The five lakes created in the area by previous eruptions of Mount Fuji has given the area its name."},{"id":"19-1","pref":"19","kind":"sight","i":1,"xy":[551.9,645.1],"ja":"新倉山浅間公園 忠霊塔","wiki":"Arakurayama Sengen Park","summary":"Arakurayama Sengen Park is a block park located at 3353 Arakura, Fujiyoshida, Yamanashi Prefecture, Japan. Installed in October 1959. Located on the hillside of Mount Arakura, it covers an area of about 4.3 hectares."},{"id":"19-2","pref":"19","kind":"sight","i":2,"xy":[553.5,647.5],"ja":"忍野八海","wiki":"Oshino Hakkai","summary":"Oshino Hakkai are the eight springs found in Oshino, Yamanashi, Japan. The aquifer water from Mount Fuji comes out to the ground to form these springs. They are a Natural monument of Japan, part of the Mount Fuji World Heritage Site, and one of Yamanashi Prefecture's important tourist attractions."},{"id":"19-3","pref":"19","kind":"sight","i":3,"xy":[540.3,631.8],"ja":"昇仙峡","wiki":"Kōfu","wikiBroader":true},{"id":"19-4","pref":"19","kind":"sight","i":4,"xy":[548.1,635.7],"ja":"勝沼のワイナリー","wiki":"Katsunuma, Yamanashi","summary":"Katsunuma was a town in Higashiyamanashi District, Yamanashi Prefecture, Japan."},{"id":"19-5","pref":"19","kind":"sight","i":5,"xy":[533.6,652.5],"ja":"身延山久遠寺","wiki":"Kuon-ji","summary":"Kuon-ji is a major Buddhist temple in Yamanashi Prefecture, Japan. Founded by Nichiren in 1281 it is today the head temple of Nichiren Shū. While the Ikegami Honmon-ji in Tokyo is also the Nichiren sect's administrative centre, Kuon-ji today plays an important role as a seminary."},{"id":"20-c","pref":"20","kind":"capital","xy":[520.9,577.7],"wiki":"Nagano (city)","pop":367184,"popYear":2021,"note":"Grew up around the temple Zenkō-ji; host of the 1998 Winter Olympics.","summary":"Nagano is the capital and largest city of Nagano Prefecture, located in the Nagano Basin (Zenkoji Daira) in the central Chūbu region of Japan. Nagano is categorized as a core city of Japan. Nagano City is the highest prefectural capital in Japan, with an altitude of 371.4 meters (1,219 ft)."},{"id":"20-0","pref":"20","kind":"sight","i":0,"xy":[510.7,602.3],"ja":"松本城","wiki":"Matsumoto Castle","summary":"Matsumoto Castle, originally known as Fukashi Castle, is a castle in city of Matsumoto, Nagano Prefecture. It is one of Japan's premier historic castles, along with Himeji and Kumamoto. It was the seat of Matsumoto Domain under the Edo Period Tokugawa shogunate."},{"id":"20-1","pref":"20","kind":"sight","i":1,"xy":[520.6,576.9],"ja":"善光寺","wiki":"Zenkō-ji","summary":"Zenkō-ji is a Buddhist temple located in the city of Nagano, Japan. The temple was built in the 7th century. It is one of the few remaining pilgrimage sites in Japan."},{"id":"20-2","pref":"20","kind":"sight","i":2,"xy":[533.5,572.4],"ja":"地獄谷野猿公苑","wiki":"Jigokudani Monkey Park","summary":"Jigokudani Monkey Park is located in Yamanouchi, Nagano Prefecture, Japan, about 3.5 hours from Tokyo. It is part of the Joshinetsu Kogen National Park (locally known as Shigakogen), and is located in the valley of the Yokoyu-River, in the northern part of the prefecture."},{"id":"20-3","pref":"20","kind":"sight","i":3,"xy":[494.6,602.1],"ja":"上高地","wiki":"Kamikōchi","summary":"Kamikōchi is a remote mountainous highland valley within the Hida Mountains range, in the western region of Nagano Prefecture, Japan."},{"id":"20-4","pref":"20","kind":"sight","i":4,"xy":[493.5,642.1],"ja":"妻籠宿","wiki":"Tsumago-juku","summary":"Tsumago-juku is a historic town in Nagiso in Nagano Prefecture, Japan. It was the forty-second of the sixty-nine post towns on the Nakasendō. It has been restored to its appearance as an Edo-era post town and is a popular tourist destination."},{"id":"20-5","pref":"20","kind":"sight","i":5,"xy":[516.8,611.9],"ja":"諏訪大社","wiki":"Suwa-taisha","summary":"Suwa Grand Shrine, historically also known as Suwa Shrine or Suwa Daimyōjin, is a group of Shinto shrines in Nagano Prefecture, Japan. The shrine complex is the ichinomiya of former Shinano Province and is considered to be one of the oldest shrines in existence, being implied by the Nihon Shoki to already stand in the late 7th century."},{"id":"21-c","pref":"21","kind":"capital","xy":[453.1,651.4],"wiki":"Gifu","pop":400118,"popYear":2020,"note":"Riverside city where cormorant fishing on the Nagara has run for some 1,300 years.","summary":"Gifu is a city located in the south-central portion of Gifu Prefecture, Japan, and serves as the prefectural capital. The city has played an important strategic role in Japan's history because of its location in the middle of the country. During the Sengoku period, various warlords used the area as a base in their efforts to unify and control Japan."},{"id":"21-0","pref":"21","kind":"sight","i":0,"xy":[459.8,602],"ja":"白川郷","wiki":"Shirakawa, Gifu (village)","summary":"Shirakawa is a village located in Ōno District, Gifu Prefecture, Japan. It is best known for being the site of Shirakawa-gō, a small, traditional village showcasing a building style known as gasshō-zukuri. Together with Gokayama in Nanto, Toyama, it is one of UNESCO's World Heritage Sites."},{"id":"21-1","pref":"21","kind":"sight","i":1,"xy":[476.4,608.4],"ja":"高山市","wiki":"Takayama, Gifu","summary":"Takayama is a city located in Gifu Prefecture, Japan. The high altitude and separation from other areas of Japan kept the area fairly isolated, allowing Takayama to develop its own culture over about a 300-year period."},{"id":"21-2","pref":"21","kind":"sight","i":2,"xy":[454.2,651],"ja":"岐阜城","wiki":"Gifu Castle","summary":"Gifu Castle is a Japanese castle located in the city of Gifu, Gifu Prefecture, Japan. Along with Mount Kinka and the Nagara River, it is one of the main symbols of the city. The castle is also known as Inabayama Castle."},{"id":"21-3","pref":"21","kind":"sight","i":3,"xy":[454.1,650.5],"ja":"長良川鵜飼","wiki":"Cormorant fishing","summary":"Cormorant fishing is a traditional fishing technique in which fishermen use trained cormorants to catch fish in rivers. Historically, cormorant fishing has taken place in China and Japan, as well as Greece, North Macedonia, and briefly, England and France."},{"id":"21-4","pref":"21","kind":"sight","i":4,"xy":[462.7,631.9],"ja":"郡上八幡","wiki":"Gujō, Gifu"},{"id":"21-5","pref":"21","kind":"sight","i":5,"xy":[492.2,645],"ja":"馬籠宿","wiki":"Magome-juku","summary":"Magome-juku was the forty-third of the sixty-nine stations of the Nakasendō connecting Edo with Kyoto in Edo period Japan. It is located in former Mino Province in what is now part of the city of Nakatsugawa, Gifu Prefecture, Japan."},{"id":"22-c","pref":"22","kind":"capital","xy":[532.4,676.9],"wiki":"Shizuoka (city)","pop":685589,"popYear":2021,"note":"Where Tokugawa Ieyasu retired; green tea and views of Mount Fuji.","summary":"Shizuoka is the capital city of Shizuoka Prefecture, Japan, and the prefecture's second-largest city in both population and area. It has been populated since prehistoric times."},{"id":"22-0","pref":"22","kind":"sight","i":0,"xy":[548.5,653.5],"ja":"富士山・三保松原","wiki":"Mount Fuji","summary":"Mount Fuji is an active stratovolcano located on the Japanese island of Honshu, with a summit elevation of 3,776.24 m (12,389 ft 3 in). It is the highest mountain in Japan, the second-highest volcano on any Asian island (after Mount Kerinci on the Indonesian island of Sumatra), and the seventh-highest peak of an island on Earth."},{"id":"22-1","pref":"22","kind":"sight","i":1,"xy":[560.2,680.6],"ja":"伊豆半島","wiki":"Izu Peninsula","summary":"The Izu Peninsula is a mountainous peninsula with a deeply indented coastline to the west of Tokyo on the Pacific coast of the island of
