<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todōfuken Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: an atlas plate — the map as a framed survey sheet on the left, a field-guide panel on the right; stacks on phones. */
:root {
  --bg: #e8edf0;        /* page ground, cool washi grey */
  --surface: #fbfcfc;   /* panel paper */
  --sea: #d3dfe7;
  --grat: #b9c9d5;      /* graticule lines */
  --land: #f8f7f2;      /* neutral land for quizzes */
  --edge: #87949f;      /* prefecture borders */
  --ink: #1b2230;       /* sumi with an indigo bias */
  --muted: #5a6474;
  --rule: #d2dae0;
  --ai: #284a8b;        /* 藍 indigo — UI accent */
  --ai-soft: #e3e9f4;
  --ai-ink: #ffffff;
  --shu: #cc4a2c;       /* 朱 vermilion — selection and seals */
  --halo: #fbfcfc;
  --ok: #26754a; --bad: #b5372a;
  --ok-fill: #a5d6b5; --late-fill: #f0d48e; --bad-fill: #eea79c;
  --hover: brightness(.92);
  --r-hokkaido: #9dd1c5; --r-tohoku: #c8db8b; --r-kanto: #f2cd74; --r-chubu: #c0b4eb;
  --r-kansai: #f3b6c6; --r-chugoku: #f4b582; --r-shikoku: #9dd3a5; --r-kyushu: #eca394;
  --sep: #ffffff;       /* prefecture borders on the coloured explore map */

  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
  --radius: 12px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);       /* responses: press, enter, fill */
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);   /* things travelling across the screen */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1118; --surface: #121a24; --sea: #0f1824; --grat: #1d2b3b; --land: #283345; --edge: #5a6a80;
    --ink: #e6ebf1; --muted: #9aa6b5; --rule: #243142; --ai: #8fb1f0; --ai-soft: #1b2a44; --ai-ink: #0b1118;
    --shu: #ff7b5a; --halo: #121a24;
    --ok: #62cc90; --bad: #ff7567; --ok-fill: #2d6946; --late-fill: #76622a; --bad-fill: #7a3731;
    --hover: brightness(1.25);
    --r-hokkaido: #3f8f87; --r-tohoku: #7f9a43; --r-kanto: #b8923a; --r-chubu: #7568b5;
    --r-kansai: #b0587a; --r-chugoku: #bb7443; --r-shikoku: #4a9660; --r-kyushu: #b15f55;
    --sep: #0b1118;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1118; --surface: #121a24; --sea: #0f1824; --grat: #1d2b3b; --land: #283345; --edge: #5a6a80;
  --ink: #e6ebf1; --muted: #9aa6b5; --rule: #243142; --ai: #8fb1f0; --ai-soft: #1b2a44; --ai-ink: #0b1118;
  --shu: #ff7b5a; --halo: #121a24;
  --ok: #62cc90; --bad: #ff7567; --ok-fill: #2d6946; --late-fill: #76622a; --bad-fill: #7a3731;
  --hover: brightness(1.25);
  --r-hokkaido: #3f8f87; --r-tohoku: #7f9a43; --r-kanto: #b8923a; --r-chubu: #7568b5;
  --r-kansai: #b0587a; --r-chugoku: #bb7443; --r-shikoku: #4a9660; --r-kyushu: #b15f55;
  --sep: #0b1118;
  color-scheme: dark;
}

[hidden] { display: none !important; }   /* the legend and tool groups set display, which would otherwise beat the attribute */
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding-inline: 16px; padding-block: 12px 16px; box-sizing: border-box; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand-ja { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .06em; line-height: 1; }
.brand-en { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.modes { position: relative; isolation: isolate; display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
.modes button { border: 0; background: none; padding: 6px 18px; border-radius: 999px; cursor: pointer; font-weight: 500; transition: color 200ms ease; }
.modes button[aria-pressed="true"] { background: var(--ai); color: var(--ai-ink); }
/* one indigo thumb slides between the modes instead of two backgrounds swapping */
@supports selector(:has(a)) {
  .modes::before { content: ""; position: absolute; z-index: -1; inset: 3px auto 3px 3px; width: calc(50% - 3px); border-radius: 999px; background: var(--ai); transition: transform 250ms var(--ease-in-out); }
  .modes:has(#mode-quiz[aria-pressed="true"])::before { transform: translateX(100%); }
  .modes button[aria-pressed="true"] { background: none; }
}

/* ---------- layout ---------- */
.layout { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 16px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; background: var(--sea); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.panel { min-height: 0; min-width: 0; overflow: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
.panel-inner { padding: 20px 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.panel-inner > *, .tabpanel > *, .field > * { min-width: 0; }

/* explore: the map owns the stage; the reading panel becomes a drawer over its right edge */
.layout.explore { grid-template-columns: minmax(0, 1fr); overflow: hidden; }   /* the closed drawer waits off-canvas without widening the page */
.layout.explore .panel { position: absolute; z-index: 6; top: 0; right: 0; bottom: 0; width: min(440px, 100%); box-shadow: 0 18px 48px rgb(15 23 42 / .22); transform: translateX(calc(100% + 24px)); visibility: hidden; transition: transform 300ms var(--ease-out), visibility 0s 300ms; }
.layout.explore.drawer-open .panel { transform: none; visibility: visible; transition: transform 300ms var(--ease-out); }
.drawer-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -6px 0 -4px; }

/* ---------- callout: the selected prefecture speaks from where it lies ---------- */
.callout { position: absolute; z-index: 4; left: 0; top: 0; width: 320px; display: grid; gap: 12px; padding: 16px 18px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 12px 32px rgb(15 23 42 / .16); }
.callout.docked { transform: none !important; left: 16px; top: auto; bottom: 16px; }
.co-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: end; }
.co-kanji { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: .04em; }
.co-name { grid-column: 1; font-size: 18px; font-weight: 700; line-height: 1.3; }
.co-name .kana { margin-left: 8px; font-size: 13px; font-weight: 400; color: var(--muted); }
.co-region { grid-row: 1; grid-column: 2; align-self: start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.co-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 0; padding-top: 12px; border-top: 1px solid var(--rule); }
.co-facts dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.co-facts dd { margin: 1px 0 0; font-size: 17px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
.co-facts dd small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.co-foot { display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--rule); }
.co-foot .btn.primary { margin-left: auto; }
.co-step { min-width: 34px; }
.co-sub { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.co-list { display: flex; flex-wrap: wrap; gap: 6px; }
.co-list button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; transition: border-color 150ms ease, transform 160ms var(--ease-out); }
.co-list button span { margin-left: 5px; color: var(--muted); }
.co-hint { margin: 0; color: var(--muted); font-size: 14px; }
.leader { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.leader line { stroke: var(--ink); stroke-width: 1.25px; }
.leader circle { fill: var(--ink); stroke: var(--surface); stroke-width: 2px; }

/* ---------- map ---------- */
#map { grid-row: 2; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.panning { cursor: grabbing; }
#map .sea { fill: var(--sea); }
#map .grat { fill: none; stroke: var(--grat); stroke-width: .8px; vector-effect: non-scaling-stroke; }
#map .inset-box { fill: var(--sea); stroke: var(--edge); stroke-width: 1px; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
#map .inset-cap { fill: var(--muted); font-size: 13px; font-family: var(--f-body); letter-spacing: .03em; }
#map .pref { cursor: pointer; transition: opacity 200ms ease; }
#map .shape { fill: var(--land); stroke: var(--edge); stroke-width: .7px; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: fill 200ms ease; }
#map .pref:focus { outline: none; }
/* keyboard focus is drawn as an outline path above every prefecture, so neighbours never cover it */
#map .focus-ring { fill: none; stroke: var(--ai); stroke-width: 3px; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .hit { fill: none; stroke: transparent; stroke-width: 14px; vector-effect: non-scaling-stroke; pointer-events: stroke; }
@media (hover: hover) and (pointer: fine) {
  #map:not(.panning) .pref:hover { filter: var(--hover); }
}

#map.m-explore .shape { stroke: var(--sep); stroke-width: 1px; }
#map.m-explore .pref[data-r="hokkaido"] .shape { fill: var(--r-hokkaido); }
#map.m-explore .pref[data-r="tohoku"] .shape { fill: var(--r-tohoku); }
#map.m-explore .pref[data-r="kanto"] .shape { fill: var(--r-kanto); }
#map.m-explore .pref[data-r="chubu"] .shape { fill: var(--r-chubu); }
#map.m-explore .pref[data-r="kansai"] .shape { fill: var(--r-kansai); }
#map.m-explore .pref[data-r="chugoku"] .shape { fill: var(--r-chugoku); }
#map.m-explore .pref[data-r="shikoku"] .shape { fill: var(--r-shikoku); }
#map.m-explore .pref[data-r="kyushu"] .shape { fill: var(--r-kyushu); }
#map .pref.fade { opacity: .35; }
#map.m-explore .pref.sel .shape { fill: var(--shu); stroke: var(--ink); stroke-width: 2px; }

#map .pref.dim { opacity: .28; pointer-events: none; }
#map .pref.st-found .shape { fill: var(--ok-fill); }
#map .pref.st-late .shape { fill: var(--late-fill); }
#map .pref.st-missed .shape { fill: var(--bad-fill); }
#map .pref.target .shape { fill: var(--shu); stroke: var(--ink); stroke-width: 1.4px; }
#map .pref.flash .shape { animation: flash .6s ease-out; }
@keyframes flash { 0%, 40% { fill: var(--bad); } 100% { fill: var(--land); } }

#map .ring { fill: none; stroke: var(--ink); stroke-width: 2.5px; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .ring.pulse { animation: ring 1.4s ease-in-out infinite; }
@keyframes ring { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .25; } }

#map .lab { display: none; fill: var(--ink); stroke: var(--halo); paint-order: stroke; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; font-family: var(--f-body); font-weight: 700; pointer-events: none; }
#map.names .lab, #map .lab.on { display: block; }
#map .lab.cull { visibility: hidden; }
#map .lab.pop { animation: pop .5s ease-out; }
@keyframes pop { 0% { fill: var(--ok); } 100% { fill: var(--ink); } }

/* tools live in their own strip so they never sit on the Okinawa inset */
.pick { min-width: 0; max-width: 240px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); font-size: 13px; }
.map-tools { grid-row: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.tool-group { display: inline-flex; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tool-group button { border: 0; background: none; padding: 5px 10px; cursor: pointer; font-size: 13px; line-height: 1.4; min-width: 34px; }
.tool-group button + button { border-left: 1px solid var(--rule); }
.tool-group button[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); font-weight: 700; }
.tool-label { align-self: center; padding: 0 4px 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* region row: the second line of the tool strip; each chip zooms to its region and lists it in the callout */
.legend { flex-basis: 100%; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.legend button { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 7px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: border-color 150ms ease, background-color 150ms ease, transform 160ms var(--ease-out); }
.legend button[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); color: var(--ai); font-weight: 700; }
.swatch { flex: none; width: 12px; height: 12px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
.scale { margin-left: auto; font-size: 11px; color: var(--muted); display: grid; justify-items: start; gap: 2px; padding-left: 2px; font-variant-numeric: tabular-nums; pointer-events: none; }
.scale-bar { height: 6px; border: 1.5px solid var(--ink); border-top: 0; }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--surface); padding: 4px 10px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.tip b { font-weight: 700; }
.tip span { opacity: .75; margin-left: 6px; }

/* ---------- shared panel bits ---------- */
.eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h2 { font-family: var(--f-display); font-size: 24px; font-weight: 800; margin: 0; line-height: 1.25; text-wrap: balance; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; text-decoration: none; transition: border-color 150ms ease, transform 160ms var(--ease-out); }
.btn.primary { background: var(--ai); color: var(--ai-ink); border-color: var(--ai); font-weight: 700; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.confirm { border-color: var(--bad); color: var(--bad); font-weight: 700; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.note a { color: inherit; }

/* ---------- explore ---------- */
.nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.nav select { width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.pf-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
.pf-kanji { font-family: var(--f-display); font-weight: 800; font-size: 46px; line-height: 1.05; margin: 0; letter-spacing: .04em; }
.pf-name { grid-column: 1; font-size: 21px; font-weight: 700; line-height: 1.3; }
.pf-name .kana { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.seal { grid-row: 1 / span 2; grid-column: 2; border: 2px solid var(--shu); color: var(--shu); border-radius: 6px; padding: 6px 7px 4px; text-align: center; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; transform: rotate(-3deg); }
.seal small { display: block; font-size: 9px; letter-spacing: .12em; }
.seal span { font-size: 20px; font-family: var(--f-display); }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; }
.tagline { margin: 0; font-size: 16px; line-height: 1.55; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; margin: 0; padding: 14px 0; border-block: 1px solid var(--rule); }
.facts > div { min-width: 0; }
.facts dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.facts dd { margin: 2px 0 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.facts dd small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.facts .wide { grid-column: 1 / -1; }
.down { color: var(--bad); } .up { color: var(--ok); }
.ages { display: grid; gap: 6px; }
.agebar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; border: 1px solid var(--rule); position: relative; }
.agebar i { display: block; height: 100%; }
.agebar .a1 { background: var(--r-shikoku); } .agebar .a2 { background: var(--sea); } .agebar .a3 { background: var(--r-chugoku); }
.agebar .nat { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.agekey { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.agekey b { color: var(--ink); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 8px 10px 9px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--shu); font-weight: 700; }
.tabpanel { display: grid; gap: 14px; }
.tabpanel h3 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tabpanel p { margin: 0; }
.items { list-style: none; margin: 0; padding: 0; display: grid; }
.items li { padding: 10px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.items li:first-child { padding-top: 0; }
.items li:last-child { border-bottom: 0; }
.items .nm { font-weight: 700; }
.items .jp { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 14px; }
.items .ds { color: var(--muted); font-size: 14px; }
.forecast { display: inline-flex; gap: 6px; color: var(--ai); font-weight: 700; text-decoration: none; }

/* ---------- quiz ---------- */
.choices-type { display: grid; gap: 8px; }
.qtype { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; cursor: pointer; transition: border-color 150ms ease, background-color 150ms ease, transform 160ms var(--ease-out); }
.qtype:has(input:checked) { border-color: var(--ai); background: var(--ai-soft); }
.qtype input { margin: 4px 0 0; accent-color: var(--ai); grid-row: span 2; }
.qtype b { font-size: 15px; }
.qtype span { font-size: 13px; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.field select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; width: fit-content; }
.seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); font-weight: 700; }
.best { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.status { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; }
.progress { display: grid; gap: 4px; font-size: 13px; font-variant-numeric: tabular-nums; }
.progress .track { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.progress .fill { height: 100%; background: var(--ai); transform-origin: left; transition: transform 300ms var(--ease-out); }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }

  fu: { ja: '府', en: 'Urban prefecture', kana: 'ふ', roma: 'fu' },

mk('path', { class: 'grat', d: SHAPES.grat }, svg);

mk('rect', { class: 'inset-box', x: ib.x, y: ib.y, width: ib.w, height: ib.h, rx: 8 }, svg);

const focusRing = mk('path', { class: 'focus-ring', d: '' }, svg);
const gLabels = mk('g', { class: 'labels' }, svg);
const prefEl = {}, labelEl = {};
PREFS.forEach(p => {
  const s = SHAPES.shapes[p.id];
  const g = mk('g', { class: 'pref', 'data-id': p.id, 'data-r': p.slug }, gPrefs);
  mk('path', { class: 'shape', d: (s.d || '') + (s.di || '') }, g);

});

let view = { ...BASE };
const pxPerUnit = () => { const r = svg.getBoundingClientRect(); return Math.min(r.width / view.w, r.height / view.h) || 1; };

  if (e.pointerType === 'touch') return;

/* ---- keyboard: one prefecture is in the tab order; arrow keys move to the nearest neighbour that way ---- */
let focusId = null;
const usable = id => id && !prefEl[id].classList.contains('dim');
function updateRoving() {
  if (!usable(focusId)) focusId = mode === 'explore' && usable(sel) ? sel : PREFS.map(p => p.id).find(usable);
  PREFS.forEach(p => prefEl[p.id].setAttribute('tabindex', p.id === focusId ? '0' : '-1'));
}
function neighbour(id, dx, dy) {
  const [x0, y0] = SHAPES.shapes[id].l;
  let best = null, bestScore = Infinity;
  PREFS.forEach(p => {
    if (p.id === id || !usable(p.id)) return;
    const [x, y] = SHAPES.shapes[p.id].l;
    const along = (x - x0) * dx + (y - y0) * dy;
    if (along <= 0) return;
    const score = along + 2 * Math.abs((x - x0) * dy - (y - y0) * dx);   // prefer straight ahead over sideways
    if (score < bestScore) { bestScore = score; best = p.id; }

  return best;
}

  const d = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] }[e.key];
  if (!d) return;
  e.preventDefault();

/* ================= quiz ================= */
const QTYPES = {

  const clicked = byId[id];
  if (Q.tries >= 3) {
    Q.status[Q.current] = 'missed'; Q.misses.push(Q.current); Q.reveal = Q.current; Q.locked = true;
    feedback(`That's ${clicked.en}. ${target.en} is the one circled.`, 'bad');
    paint(); updateProgress();
    setTimeout(nextQuestion, 1900);
  } else {
    feedback(`That's ${clicked.en}. Try again (${3 - Q.tries} ${3 - Q.tries === 1 ? 'try' : 'tries'} left).`, 'bad');
  }
}
function nameAnswer(id) {
  if (Q.locked) return;
  const target = byId[Q.current];
  Q.locked = true;
  if (id === Q.current) {
    Q.status[Q.current] = 'found'; Q.firstTry++;
    feedback(`Correct: ${target.en} ${target.ja}.`, 'ok');
  } else {
    Q.status[Q.current] = 'missed'; Q.misses.push(Q.current);
    feedback(id ? `Not quite. It's ${target.en} ${target.ja}.` : `It was ${target.en} ${target.ja}.`, 'bad');
  }
  if (Q.answer === 'choice') {
    document.querySelectorAll('#answers button').forEach(b => {
      b.disabled = true;
      if (b.dataset.id === Q.current) b.classList.add('right'); else if (b.dataset.id === id) b.classList.add('wrong');
    });
  } else { const inp = $('#answer'); if (inp) inp.disabled = true; }
  paint(); updateProgress();
  setTimeout(nextQuestion, id === Q.current ? 700 : 1700);
}
function allInput(val, submitted) {
  const id = matchName(val);
  if (id && Q.scope.has(id) && !Q.status[id]) {
    Q.status[id] = 'found'; Q.lastFound = id;
    $('#answer').value = '';
    feedback(`${byId[id].en} ${byId[id].ja}`, 'ok');
    paint();
    labelEl[id].classList.remove('pop'); void labelEl[id].getBBox(); labelEl[id].classList.add('pop');
    updateProgress(); renderRegionsLeft();
    if (Object.keys(Q.status).length === Q.scope.size) finishQuiz();
    return;
  }
  if (!submitted || !val.trim()) return;
  if (id && Q.status[id]) feedback(`You already found ${byId[id].en}.`, '');
  else if (id) feedback(`${byId[id].en} is not in ${scopeLabel(Q.scopeKey)}.`, 'bad');
  else feedback(`No prefecture called “${val.trim()}”. Check the spelling.`, 'bad');
}
function giveUp() {
  if (!Q || Q.phase !== 'running') return;
  [...Q.scope].forEach(id => { if (!Q.status[id]) { Q.status[id] = 'missed'; Q.misses.push(id); } });
  finishQuiz();
}
function finishQuiz() {
  Q.phase = 'done'; Q.t1 = Date.now(); Q.current = null; Q.reveal = null;
  clearInterval(timer);
  const total = Q.type === 'all' ? Q.scope.size : Q.pool.length;
  const correct = Q.type === 'all' ? Object.values(Q.status).filter(s => s === 'found').length : Q.firstTry;
  Q.result = { correct, total, pct: Math.round(correct / total * 100), ms: Q.t1 - Q.t0 };
  if (!Q.practice) {
    const k = bestKey(Q.type, Q.scopeKey, Q.answer), prev = store.get(k, null), r = Q.result;
    if (!prev || r.pct > prev.pct || (r.pct === prev.pct && r.ms < prev.ms)) store.set(k, { pct: r.pct, ms: r.ms });
    Q.result.prevBest = prev;
  }
  renderQuiz(); paint();
}
function updateProgress() {
  const el = $('#progress'); if (!el || !Q) return;
  const total = Q.type === 'all' ? Q.scope.size : Q.pool.length;
  const done = Object.keys(Q.status).filter(id => Q.type === 'all' ? Q.scope.has(id) : Q.pool.includes(id)).length;
  el.querySelector('.txt').textContent = Q.type === 'all' ? `${done} of ${total} named` : `${done} of ${total} answered · ${Q.firstTry} first try`;
  el.querySelector('.fill').style.transform = `scaleX(${done / total})`;
}
function renderRegionsLeft() {
  const el = $('#regions-left'); if (!el) return;
  el.innerHTML = REGIONS.filter(r => PREFS.some(p => p.region === r.key && Q.scope.has(p.id))).map(r => {
    const ids = PREFS.filter(p => p.region === r.key && Q.scope.has(p.id)).map(p => p.id);
    const got = ids.filter(id => Q.status[id] === 'found').length;
    return `<div class="${got === ids.length ? 'done' : ''}"><span>${esc(r.key)}</span><span>${got}/${ids.length}</span></div>`;
  }).join('');
}

function quizSetupHTML() {
  const best = store.get(bestKey(setup.type, setup.scope, setup.answer), null);
  return `<div class="panel-inner">
    <div><div class="eyebrow">Quiz</div><h2>How well do you know the map?</h2></div>
    <fieldset class="choices-type" style="border:0;padding:0;margin:0">
      <legend class="eyebrow" style="padding:0;margin-bottom:8px">Game</legend>
      ${Object.entries(QTYPES).map(([k, t]) => `<label class="qtype"><input type="radio" name="qtype" value="${k}"${setup.type === k ? ' checked' : ''}><b>${t.title}</b><span>${t.desc}</span></label>`).join('')}
    </fieldset>
    <div class="field">
      <label for="scope">Region</label>
      <select id="scope"><option value="all"${setup.scope === 'all' ? ' selected' : ''}>All Japan (47)</option>${REGIONS.map(r => `<option value="${esc(r.key)}"${setup.scope === r.key ? ' selected' : ''}>${esc(r.key)} (${scopeIds(r.key).length})</option>`).join('')}</select>
    </div>
    ${setup.type === 'name' ? `<div class="field"><span class="lbl">Answer by</span><div class="seg" role="group" aria-label="Answer by">
      <button type="button" data-answer="choice" aria-pressed="${setup.answer === 'choice'}">Multiple choice</button>
      <button type="button" data-answer="type" aria-pressed="${setup.answer === 'type'}">Typing</button></div></div>` : ''}
    ${setup.type !== 'find' ? `<p class="note">Typing accepts romaji with or without long vowels (Kyoto, Kyōto, Kyouto), with or without -ken, as well as kanji (京都府, 京都) and kana.</p>` : ''}
    <div class="row">
      <button type="button" class="btn primary" id="start">Start ${QTYPES[setup.type].title}</button>
      <span class="best">${best ? `Best: ${best.pct}% in ${mmss(best.ms)}` : 'No best score yet'}</span>
    </div>
    <div class="legend-q"><span><i style="background:var(--ok-fill)"></i>First try</span>${setup.type === 'find' ? `<span><i style="background:var(--late-fill)"></i>Found after a miss</span>` : ''}<span><i style="background:var(--bad-fill)"></i>Missed</span></div>
  </div>`;
}
function quizRunHTML() {
  const t = byId[Q.current];
  let body = '';
  if (Q.type === 'find') {
    body = `<div class="prompt"><div class="eyebrow">Click on the map</div><div class="big" lang="ja">${esc(t.ja)}</div><div class="sub">${esc(t.en)}</div></div>
      <div class="feedback ${Q.fbClass}" id="feedback" aria-live="polite">${esc(Q.feedback)}</div>
      <div class="row"><button type="button" class="btn" id="skip">Show me &amp; skip</button></div>`;
  } else if (Q.type === 'name') {
    body = `<div class="prompt"><div class="eyebrow">Which prefecture is highlighted?</div><div class="sub">It's the vermilion one, circled on the map.</div></div>
      ${Q.answer === 'choice'
        ? `<div class="answers" id="answers">${Q.choices.map((id, i) => `<button type="button" data-id="${id}"><span class="k">${i + 1}</span><b>${esc(byId[id].en)}</b><span lang="ja">${esc(byId[id].ja)}</span></button>`).join('')}</div>`
        : `<form class="typein" id="typein" autocomplete="off"><input id="answer" aria-label="Prefecture name" placeholder="Type the name…" autocapitalize="off" spellcheck="false"><button class="btn primary" type="submit">Check</button></form>
           <div class="row"><button type="button" class="btn ghost small" id="skip">I don't know</button></div>`}
      <div class="feedback ${Q.fbClass}" id="feedback" aria-live="polite">${esc(Q.feedback)}</div>`;
  } else {
    body = `<form class="typein" id="typein" autocomplete="off"><input id="answer" aria-label="Prefecture name" placeholder="Type a prefecture…" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Enter</button></form>
      <div class="feedback ${Q.fbClass}" id="feedback" aria-live="polite">${esc(Q.feedback)}</div>
      <div class="regions-left" id="regions-left"></div>
      <div class="row"><button type="button" class="btn" id="giveup">Give up &amp; show the rest</button></div>`;
  }
  return `<div class="panel-inner">
    <div class="status">
      <div class="progress" id="progress"><span class="txt"></span><div class="track"><div class="fill" style="transform:scaleX(0)"></div></div></div>
      <span class="clock" id="clock">${mmss(Date.now() - Q.t0)}</span>
      <button type="button" class="btn small" id="quit">Quit</button>
    </div>
    <div class="eyebrow">${esc(QTYPES[Q.type].title)} · ${esc(Q.practice ? 'Practice your misses' : scopeLabel(Q.scopeKey))}</div>
    ${body}
  </div>`;
}
function quizDoneHTML() {
  const r = Q.result, perfect = r.correct === r.total;
  const missBtns = [...new Set(Q.misses)].map(id => `<button type="button" data-open="${id}">${esc(byId[id].en)} <span lang="ja">${esc(byId[id].ja)}</span></button>`).join('');
  const prev = r.prevBest;
  let bestLine = Q.practice ? 'Practice round — not counted for best scores.' : (!prev ? 'First score saved for this game.' : (r.pct > prev.pct || (r.pct === prev.pct && r.ms < prev.ms)) ? `New best! Previous: ${prev.pct}% in ${mmss(prev.ms)}.` : `Best so far: ${prev.pct}% in ${mmss(prev.ms)}.`);
  return `<div class="panel-inner">
    <div class="eyebrow">${esc(QTYPES[Q.type].title)} · ${esc(Q.practice ? 'Practice your misses' : scopeLabel(Q.scopeKey))}</div>
    <div class="result">
      <div><div class="score">${r.correct}<small> / ${r.total}</small></div><div class="muted">${r.pct}% ${Q.type === 'all' ? 'named' : 'right on the first try'} · ${mmss(r.ms)}</div></div>
      ${perfect ? `<div class="hanko" lang="ja" role="img" aria-label="全問正解, perfect score">全問<br>正解</div>` : ''}
    </div>
    <p class="muted" style="margin:0">${esc(bestLine)}</p>
    ${missBtns ? `<div class="field"><span class="lbl">To review — tap to read about it</span><div class="misslist">${missBtns}</div></div>` : ''}
    <div class="row">
      <button type="button" class="btn primary" id="again">Play again</button>
      ${missBtns ? `<button type="button" class="btn" id="practice">Practice the misses</button>` : ''}
      <button type="button" class="btn ghost" id="settings">Change game</button>
    </div>
    <p class="note">Hover the map to see names. Green: right first time${Q.type === 'find' ? ' · yellow: found after a miss' : ''} · red: missed.</p>
  </div>`;
}
/* destructive quiz exits ask once, inline: the first click arms the button for 3 seconds */
function twoStep(btn, ask, act, needed = () => true) {
  let armed = 0;
  const label = btn.textContent;
  btn.onclick = () => {
    if (armed || !needed()) { clearTimeout(armed); act(); return; }
    btn.textContent = ask; btn.classList.add('confirm');
    armed = setTimeout(() => { armed = 0; btn.textContent = label; btn.classList.remove('confirm'); }, 3000);
  };
}
function renderQuiz() {
  const restore = rememberFocus();
  renderQuizPanel();
  restore();
}
function renderQuizPanel() {
  if (mode !== 'quiz') return;
  $('#layout').classList.toggle('quiz-live', !!(Q && Q.phase === 'running'));
  if (!Q) {
    panel.innerHTML = quizSetupHTML();
    panel.querySelectorAll('input[name="qtype"]').forEach(r => r.onchange = () => { setup.type = r.value; store.set('setup', setup); renderQuiz(); });
    $('#scope').onchange = e => { setup.scope = e.target.value; store.set('setup', setup); renderQuiz(); previewScope(); };
    panel.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => { setup.answer = b.dataset.answer; store.set('setup', setup); renderQuiz(); });
    $('#start').onclick = () => startQuiz();
    return;
  }
  if (Q.phase === 'running') {
    panel.innerHTML = quizRunHTML();
    twoStep($('#quit'), 'Quit? Click again', () => { clearInterval(timer); Q = null; renderQuiz(); paint(); previewScope(); }, () => Object.keys(Q.status).length > 0);
    if (Q.type === 'find') $('#skip').onclick = () => { if (Q.locked) return; Q.tries = 2; const t = byId[Q.current]; Q.status[Q.current] = 'missed'; Q.misses.push(Q.current); Q.reveal = Q.current; Q.locked = true; feedback(`${t.en} is the one circled.`, 'bad'); paint(); updateProgress(); setTimeout(nextQuestion, 1700); };
    if (Q.type === 'name') {
      if (Q.answer === 'choice') panel.querySelectorAll('#answers button').forEach(b => b.onclick = () => nameAnswer(b.dataset.id));
      else {
        $('#typein').onsubmit = e => {
          e.preventDefault();
          const v = $('#answer').value; if (!v.trim()) return;
          const id = matchName(v);
          if (!id) { feedback(`“${v.trim()}” isn't a prefecture name. Check the spelling and try again.`, 'bad'); return; }   // a typo is not a wrong answer
          nameAnswer(id);
        };
        $('#skip').onclick = () => nameAnswer(null);
      }
    }
    if (Q.type === 'all') {
      const inp = $('#answer');
      inp.oninput = () => allInput(inp.value, false);
      $('#typein').onsubmit = e => { e.preventDefault(); allInput(inp.value, true); };
      twoStep($('#giveup'), 'End the round? Click again', giveUp);
      renderRegionsLeft();
      inp.focus({ preventScroll: true });
    }
    updateProgress();
    return;
  }
  panel.innerHTML = quizDoneHTML();
  $('#again').onclick = () => startQuiz();
  if ($('#practice')) $('#practice').onclick = () => startQuiz({ pool: [...new Set(Q.misses)] });
  $('#settings').onclick = () => { Q = null; renderQuiz(); paint(); previewScope(); };
  panel.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { setMode('explore'); selectPref(b.dataset.open, { zoom: true }); });
}
function previewScope() {
  if (mode !== 'quiz' || Q) return;
  paint();
  if (setup.scope === 'all') resetView(); else fitBox(unionBox(scopeIds(setup.scope)), 0.08);
}
document.addEventListener('keydown', e => {
  if (mode !== 'quiz' || !Q || Q.phase !== 'running' || Q.type !== 'name' || Q.answer !== 'choice') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4 && Q.choices[n - 1]) nameAnswer(Q.choices[n - 1]);
});

/* ================= modes ================= */
function setMode(m) {
  mode = m; store.set('mode', m);
  $('#mode-explore').setAttribute('aria-pressed', String(m === 'explore'));
  $('#mode-quiz').setAttribute('aria-pressed', String(m === 'quiz'));
  $('#layout').classList.toggle('quiz-live', m === 'quiz' && !!(Q && Q.phase === 'running'));
  $('#layout').classList.toggle('explore', m === 'explore');
  if (m !== 'explore') { drawerOpen = false; $('#layout').classList.remove('drawer-open'); }
  hideTip(); renderNames(); renderLegend(); renderPick(); renderCallout();
  setLabelText();
  paint();
  if (m === 'explore') renderExplore();
  else { renderQuiz(); previewScope(); }
}
$('#mode-explore').onclick = () => setMode('explore');
$('#mode-quiz').onclick = () => setMode('quiz');

/* ================= boot ================= */
setLabelText();
setView(BASE);
if (sel) gPrefs.appendChild(prefEl[sel]);
setMode(mode === 'quiz' ? 'quiz' : 'explore');
})();
</script>
